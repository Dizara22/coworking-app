    </button></div>`;
}
function dayHTML(){
  const date = state.date, d = parse(date), vis = visibleRes(), st = statsFor([date], vis);
  const mon = addDays(date, -((d.getDay() + 6) % 7));
  const week = Array.from({length:7}, (_, i) => {
    const ds = addDays(mon, i), dd = parse(ds), s = statsFor([ds], vis);
    return `<button class="wd" data-action="pick-day" data-date="${ds}"${ds === date ? ' aria-current="date"' : ''} aria-label="${dowDate(ds)}, загрузка ${Math.round(s.occ*100)}%"><span>${DOW[dd.getDay()]}</span><b>${dd.getDate()}</b><i style="--p:${s.occ.toFixed(2)}"></i></button>`;
  }).join('');
  const ids = new Set(vis.map(r => r.id));
  let body;
  if (!vis.length) body = '<div class="empty">В этом фильтре нет мест.</div>';
  else if (state.dayView === 'list'){
    const list = bookings.filter(b => b.date === date && b.status !== 'cancelled' && ids.has(b.resourceId))
      .sort((a, b) => a.start - b.start || KIND_ORDER.indexOf(res(a.resourceId).kind) - KIND_ORDER.indexOf(res(b.resourceId).kind));
    body = `<div class="tline" id="dayList">${list.length ? list.map(entryHTML).join('') : '<div class="empty">На этот день записей нет.<br>Нажмите «+», чтобы записать арендатора.</div>'}</div>`;
  } else {
    const n = vis.length;
    const head = vis.map(r => `<div class="rh"><div class="n"><i class="dot ${r.kind}"></i>${esc(r.name)}</div><div class="p">${rub(r.hour)}/ч</div></div>`).join('');
    let times = '';
    for (let t = OPEN; t <= CLOSE; t += 60) times += `<span style="top:${(t-OPEN)/STEP*SLOT}px"${t === OPEN ? ' class="first"' : t === CLOSE ? ' class="last"' : ''}>${hm(t)}</span>`;
    const showNow = date === TODAY && NOW_MIN > OPEN && NOW_MIN < CLOSE;
    const cols = vis.map(r => {
      const bs = bookings.filter(b => b.resourceId === r.id && b.date === date && b.status !== 'cancelled').sort((a,b) => a.start - b.start);
      return `<div class="col" data-action="slot" data-res="${r.id}" title="Нажмите на свободное время, чтобы записать">${bs.map(blockHTML).join('')}${showNow ? `<span class="now" style="top:${(NOW_MIN-OPEN)/STEP*SLOT}px"></span>` : ''}</div>`;
    }).join('');
    body = `<div class="grid-scroll" id="gridScroll"><div class="grid" style="grid-template-columns:48px repeat(${n},minmax(96px,1fr));min-width:${48 + n*96}px"><div class="corner"></div>${head}<div class="times">${times}</div>${cols}</div></div>`;
  }
  return `<section class="day">
    <div class="dpanel">
      <div class="dp-top"><button class="back" data-action="back-month">${ICON.left}<span>${MONTHS[d.getMonth()]}</span></button>
        <div class="nav">${date === TODAY ? '' : '<button class="pill-btn" data-action="go-today">Сегодня</button>'}
          <button class="icon-btn" data-action="day-prev" aria-label="Предыдущий день">${ICON.left}</button>
          <button class="icon-btn" data-action="day-next" aria-label="Следующий день">${ICON.right}</button></div></div>
      <h1 class="dtitle">${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}</h1>
      <p class="dsub">${DOW_FULL[d.getDay()]} · ${st.cnt} ${plural(st.cnt,'бронь','брони','броней')} · ${Math.round(st.occ*100)}% · ${rub(st.charged)}${st.debt ? ` · долг ${rub(st.debt)}` : ''}</p>
      <div class="week">${week}</div>
    </div>
    <div class="dctl">${filterChips()}<div class="seg mini icons" role="group" aria-label="Вид дня"><button data-action="day-view" data-v="list" aria-pressed="${state.dayView === 'list'}" aria-label="Лента" title="Лента">${ICON.list}</button><button data-action="day-view" data-v="grid" aria-pressed="${state.dayView === 'grid'}" aria-label="Сетка" title="Сетка">${ICON.grid}</button></div></div>
    ${body}
  </section>`;
}

function tenantSummary(id){
  let count = 0, mins = 0, charged = 0, debt = 0, next = null;
  for (const b of bookings){
    if (b.tenantId !== id || b.status === 'cancelled') continue;
    count++; mins += b.end - b.start;
    if (isCharged(b)){ charged += b.price; if (b.payment === 'unpaid' && b.date <= TODAY) debt += b.price; }
    if (b.status === 'active' && b.date >= TODAY && (!next || b.date < next.date || (b.date === next.date && b.start < next.start))) next = b;
  }
  return {count, mins, charged, debt, next};
}
function tenantRows(){
  const q = norm(state.tq);
  const list = tenants.filter(t => !q || norm(`${t.name} ${t.phone} ${t.activity} ${t.tg}`).includes(q)).sort((a,b) => a.name.localeCompare(b.name,'ru'));
  if (!tenants.length) return `<div class="empty">База пока пустая. Нажмите «+», чтобы добавить первого арендатора, или создайте его прямо при записи.</div>`;
  if (!list.length) return `<div class="empty">Никого не нашли. <button class="link-btn" data-action="new-tenant">Добавить «${esc(state.tq.trim())}»</button></div>`;
  return list.map(t => {
    const s = tenantSummary(t.id);
    return `<button class="lrow" data-action="open-tenant" data-id="${t.id}">${avatar(t)}<span class="lmain"><b>${esc(t.name)}</b><small>${esc(t.activity || 'Род занятий не указан')}${s.next ? ` · след. ${dowDate(s.next.date)}` : ''}</small></span><span class="lside">${s.debt ? `<b class="bad">${rub(s.debt)}</b><small>долг</small>` : `<b>${s.count}</b><small>${plural(s.count,'бронь','брони','броней')}</small>`}</span></button>`;
  }).join('');
}
const tenantsHTML = () => `<section>
  <h1 class="ptitle">Арендаторы <span>${tenants.length}</span></h1>
  <div class="search" style="margin-bottom:12px">${ICON.search}<input id="tq" type="search" placeholder="Имя, телефон или род занятий" value="${esc(state.tq)}" autocomplete="off" aria-label="Поиск арендатора"></div>
  <div class="list" id="tList">${tenantRows()}</div>
</section>`;

function deltaTxt(cur, prev, pd){
  if (!prev) return '';
  const d = Math.round((cur - prev) / Math.abs(prev) * 100);
  return `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : '−'}${Math.abs(d)}%</span> к ${MONTHS_DAT[pd.getMonth()]}`;
}
function financeHTML(){
  const {ay:y, am:m} = state, a = analytics(y, m);
  const pd = new Date(y, m-1, 1), p = analytics(pd.getFullYear(), pd.getMonth());
  const isNow = y === now.getFullYear() && m === now.getMonth();
  const head = `<div class="fhead"><h1>Финансы</h1></div>
    <div class="mswitch"><button class="icon-btn" data-action="an-prev" aria-label="Предыдущий месяц">${ICON.left}</button><b>${MONTHS[m]} <span>${y}</span></b><div class="nav">${isNow ? '' : '<button class="pill-btn" data-action="an-today">Сейчас</button>'}<button class="icon-btn" data-action="an-next" aria-label="Следующий месяц">${ICON.right}</button></div></div>
    <div class="seg" role="group" aria-label="Раздел финансов" style="margin-bottom:14px"><button data-action="fin" data-v="summary" aria-pressed="${state.fin === 'summary'}">Сводка</button><button data-action="fin" data-v="expenses" aria-pressed="${state.fin === 'expenses'}">Расходы</button></div>`;
  return `<section>${head}${state.fin === 'summary' ? summaryHTML(a, p, pd, isNow, m) : expensesHTML(a, m)}</section>`;
}
function summaryHTML(a, p, pd, isNow, m){
  if (!a.count && !a.exp.total) return `<div class="empty">В ${MONTHS_PREP[m]} нет ни броней, ни расходов.</div>`;
  const pDelta = p.revenue || p.exp.total ? (() => { const d = p.profit ? Math.round((a.profit - p.profit) / Math.abs(p.profit) * 100) : null; return d === null ? '' : ` · <b>${d >= 0 ? '+' : '−'}${Math.abs(d)}%</b> к ${MONTHS_DAT[pd.getMonth()]}`; })() : '';
  const hero = `<div class="herocard${a.profit < 0 ? ' neg' : ''}">${waveSVG()}
    <div class="h-top"><span>Прибыль за ${MONTHS[m].toLowerCase()}</span><small>выручка − расходы</small></div>
    <div class="h-val">${(a.profit < 0 ? '−' : '') + Math.round(Math.abs(a.profit)).toLocaleString('ru-RU')}<small>₽</small></div>
    <div class="h-sub">${a.revenue ? `маржа ${Math.round(a.margin*100)}%` : 'выручки нет'}${pDelta}</div></div>`;
  const tiles = `<div class="tiles">
    <div class="tile"><span class="badge">${ICON.coin}</span><span>Выручка</span><b>${rub(a.revenue)}</b><small>${deltaTxt(a.revenue, p.revenue, pd) || `${a.count} ${plural(a.count,'бронь','брони','броней')}`}</small></div>
    <button class="tile" data-action="fin" data-v="expenses"><span class="badge">${ICON.out}</span><span>Расходы</span><b>${rub(a.exp.total)}</b><small>${a.exp.total ? `${Math.round(a.exp.recTotal / a.exp.total * 100)}% постоянные` : 'подробнее ›'}</small></button>
    <div class="tile"><span class="badge">${ICON.check}</span><span>Получено</span><b>${rub(a.paid)}</b><small>${a.revenue ? Math.round(a.paid / a.revenue * 100) : 0}% выручки</small></div>
    <div class="tile${a.debt ? ' bad' : ''}"><span class="badge">${ICON.alert}</span><span>Долг</span><b>${rub(a.debt)}</b><small>прошедшие без оплаты</small></div>
    <div class="tile"><span class="badge">${ICON.clock}</span><span>Ожидается</span><b>${rub(a.expected)}</b><small>будущие брони</small></div>
    <div class="tile${a.cashProfit < 0 ? ' bad' : ''}"><span class="badge">${ICON.wallet}</span><span>Касса после расходов</span><b>${sRub(a.cashProfit)}</b><small>получено − расходы</small></div>
  </div>`;

  const perf = `<div class="sec-h"><h2>Загрузка мест</h2><small>${hours(a.mins)} ч продано</small></div>
    <div class="glass perf">${ringSVG(a.occ, Math.round(a.occ*100) + '%', 'всех мест')}
    <ul>${KIND_ORDER.map(k => { const x = a.kinds[k], occ = x.n ? x.mins / (x.n * DAY_MIN * a.days) : 0; return `<li><i class="dot ${k}"></i><span>${KINDS[k].many}</span><b>${Math.round(occ*100)}%</b><small>${rub(x.rev)} · ${a.revenue ? Math.round(x.rev / a.revenue * 100) : 0}% выручки</small></li>`; }).join('')}</ul></div>`;

  const rlist = sortRes(cfg.resources.filter(r => r.active || a.res[r.id].rev));
  const maxRes = Math.max(...rlist.map(r => a.res[r.id].rev), 1);
  const places = `<div class="sec-h"><h2>Рабочие места</h2><small>выручка за месяц</small></div><div class="list">${rlist.map(r => {
    const x = a.res[r.id], occ = x.mins / (DAY_MIN * a.days);
    return `<div class="rank-row"><span class="rk"><i class="dot ${r.kind}"></i></span><span class="lmain"><b>${esc(r.name)}</b><small>${hours(x.mins)} ч · загрузка ${Math.round(occ*100)}%</small></span><span class="lside"><b>${rub(x.rev)}</b></span><span class="meter"><i class="${r.kind}" style="width:${(x.rev / maxRes * 100).toFixed(1)}%"></i></span></div>`;
  }).join('')}</div>`;

  const tl = Object.entries(a.ten).sort((x, z) => z[1].rev - x[1].rev);
  const maxTen = Math.max(...tl.map(([, t]) => t.rev), 1);
  const people = tl.length ? `<div class="sec-h"><h2>Кто сколько принёс</h2><small>${tl.length} ${plural(tl.length,'арендатор','арендатора','арендаторов')}</small></div><div class="list">${tl.map(([id, t], i) => {
    const pp = ten(id);
    return `<button class="rank-row" data-action="open-tenant" data-id="${id}"><span class="rk">${i+1}.</span><span class="lmain"><b>${esc(pp.name)}</b><small>${hours(t.mins)} ч · ${t.count} ${plural(t.count,'бронь','брони','броней')}${pp.activity ? ' · ' + esc(pp.activity) : ''}</small></span><span class="lside"><b>${rub(t.rev)}</b>${t.debt ? `<small class="bad">долг ${rub(t.debt)}</small>` : `<small>${a.revenue ? (t.rev / a.revenue * 100).toFixed(1).replace('.', ',') : 0}%</small>`}</span><span class="meter"><i style="width:${(t.rev / maxTen * 100).toFixed(1)}%"></i></span></button>`;
  }).join('')}</div>` : '';
  return `${hero}${tiles}${perf}${places}${people}
    <div style="margin-top:16px"><button class="btn ghost" data-action="copy-csv">${ICON.copy}<span>Скопировать отчёт для Excel</span></button></div>`;
}
function expensesHTML(a, m){
  const ex = a.exp, cnt = ex.rec.length + ex.one.length;
  const hero = `<div class="herocard neg">${waveSVG()}<div class="h-top"><span>Расходы за ${MONTHS[m].toLowerCase()}</span><small>${cnt} ${plural(cnt,'запись','записи','записей')}</small></div>
    <div class="h-val">${Math.round(ex.total).toLocaleString('ru-RU')}<small>₽</small></div>
    <div class="h-sub">${a.revenue ? `${Math.round(ex.total / a.revenue * 100)}% от выручки` : 'выручки нет'}${ex.recTotal ? ` · ежемесячные ${rub(ex.recTotal)}` : ''}</div></div>`;
  const shown = cfg.cats.filter(c => !c.hidden || ex.byCat[c.id]);
  const buttons = `<div class="sec-h"><h2>Статьи расходов</h2><button class="link-btn" data-action="cat-manage">Настроить</button></div>
    <div class="ctiles">${shown.map(c => { const v = ex.byCat[c.id] || 0;
      return `<button class="ctile" data-action="exp-add-cat" data-id="${c.id}" aria-label="Добавить расход: ${esc(c.name)}">${catIco(c.id)}<span class="cplus" aria-hidden="true">${ICON.plus}</span><b>${esc(c.name)}</b><span class="camt${v ? '' : ' zero'}">${v ? rub(v) : 'нет расходов'}</span><span class="cbar"><i style="width:${ex.total ? (v / ex.total * 100).toFixed(1) : 0}%"></i></span></button>`; }).join('')}
    <button class="ctile add" data-action="cat-new"><span class="cat-ico plus" aria-hidden="true">${ICON.plus}</span><b>Новая статья</b><span class="camt zero">своя кнопка</span></button></div>`;
  const row = e => `<button class="lrow" data-action="${e.rec ? 'edit-rec' : 'edit-exp'}" data-id="${e.id}">${catIco(e.cat)}<span class="lmain"><b>${esc(e.note || catName(e.cat))}</b><small>${esc(catName(e.cat))} · ${e.rec ? `каждое ${+e.date.slice(8)}-е число` : dowDate(e.date)}</small></span><span class="lside"><b>${rub(e.amount)}</b>${e.rec ? '<small>↻ ежемесячно</small>' : ''}</span></button>`;
  const recList = ex.rec.length ? `<div class="sec-h"><h2>Ежемесячные</h2><small>${rub(ex.recTotal)}</small></div><div class="list">${ex.rec.slice().sort((x, z) => z.amount - x.amount).map(row).join('')}</div>` : '';
  const oneList = ex.one.length ? `<div class="sec-h"><h2>Разовые</h2><small>${rub(ex.total - ex.recTotal)}</small></div><div class="list">${ex.one.slice().sort((x, z) => z.date.localeCompare(x.date)).map(row).join('')}</div>` : '';
  const empty = ex.total ? '' : '<div class="empty">Нажмите на статью, чтобы внести расход.<br>Ежемесячные расходы достаточно внести один раз.</div>';
  return hero + buttons + empty + recList + oneList;
}

function settingsHTML(){
  const grp = k => {
    const list = cfg.resources.filter(r => r.kind === k);
    if (!list.length) return '';
    const n = list.filter(r => r.active).length;
    return `<div class="sec-h"><h2>${KINDS[k].many}</h2><small>${n} ${plural(n,'место','места','мест')}</small></div><div class="list">${list.map(r =>
      `<button class="lrow${r.active ? '' : ' off'}" data-action="open-resource" data-id="${r.id}"><span class="ico k-${r.kind}">${KIND_ICON[r.kind]}</span><span class="lmain"><b>${esc(r.name)}</b><small>${esc(r.note || KINDS[k].one)}${r.active ? '' : ' · скрыто'}</small></span><span class="lside"><b>${rub(r.hour)}/ч</b><small>день ${rub(r.day)}</small></span></button>`).join('')}</div>`;
  };
  return `<section>
    <h1 class="ptitle">Места</h1>
    <div class="glass rules">
      <div class="rule"><span>Часы работы</span><b>10:00–22:00</b></div>
      <div class="rule"><span>Шаг сетки</span><b>15 минут</b></div>
      <div class="rule"><label for="sMin">Минимальная бронь</label><select id="sMin">${[15,30,60,90,120].map(v => `<option value="${v}"${cfg.minDur === v ? ' selected' : ''}>${durTxt(v)}</option>`).join('')}</select></div>
      <div class="rule"><span>Цены</span><button class="link-btn" data-action="price-all">Изменить для всех</button></div>
      <div class="rule stack"><span>Оформление</span><div class="seg mini" role="group" aria-label="Оформление">${[['light','Светлая'],['dusk','Сумерки'],['dark','Тёмная'],['auto','Авто']].map(([v,l]) => `<button data-action="skin" data-v="${v}" aria-pressed="${skinPref === v}">${l}</button>`).join('')}</div></div>
    </div>
    ${KIND_ORDER.map(grp).join('')}
    <div class="sec-h"><h2>Хранение данных</h2><small>${usage.keys} из 1024 ключей</small></div>
    <div class="glass rules">
      <div class="rule"><span>Где лежат</span><b>${kv.mode === 'cloud' ? 'Облако Telegram' : 'Демо, не сохраняется'}</b></div>
      ${kv.mode === 'cloud' ? '' : '<div class="rule"><span class="note" style="width:100%">Приложение открыто не из Telegram, поэтому показаны примеры. Откройте его через бота — данные будут храниться в вашем облаке Telegram.</span></div>'}
      <div class="storage-actions">
        <button class="btn ghost" data-action="backup">${ICON.copy}<span>Скопировать резервную копию</span></button>
        <button class="btn ghost" data-action="restore-open">Восстановить из копии</button>
      </div>
    </div>
  </section>`;
}

function updateSync(){
  const el = $('#sync'); if (!el) return;
  let cls = '', txt;
  if (kv.mode === 'demo') txt = 'демо';
  else if (pending){ cls = 'busy'; txt = 'сохраняю…'; }
  else if (lastError){ cls = 'err'; txt = 'ошибка'; }
  else { cls = 'ok'; txt = 'в облаке'; }
  el.className = 'sync' + (cls ? ' ' + cls : ''); el.textContent = txt;
}

function render(){
  if (!state.ready) return;
  $('#fab').setAttribute('aria-label', {schedule:'Новая бронь', tenants:'Новый арендатор', finance:'Новый расход', settings:'Новое место'}[state.tab]);
  document.querySelectorAll('.tabs [data-tab]').forEach(b => b.setAttribute('aria-current', b.dataset.tab === state.tab ? 'page' : 'false'));
  updateSync();

  const v = $('#view'), key = `${state.tab}|${state.mode}|${state.dayView}|${state.fin}`;
  const oldGrid = $('#gridScroll'), oldList = $('#dayList');
  const same = v.dataset.key === key && v.dataset.date === state.date;
  const gridPos = oldGrid ? [oldGrid.scrollLeft, oldGrid.scrollTop] : null, listPos = oldList ? oldList.scrollTop : 0;
  const viewTop = v.dataset.key === key ? v.scrollTop : 0;
  const isDay = state.tab === 'schedule' && state.mode === 'day';
  v.className = 'view' + (isDay ? ' is-day' : '');
  v.innerHTML = state.tab === 'schedule' ? (isDay ? dayHTML() : homeHTML()) : state.tab === 'tenants' ? tenantsHTML() : state.tab === 'finance' ? financeHTML() : settingsHTML();
  v.dataset.key = key; v.dataset.date = state.date;
  const g = $('#gridScroll'), l2 = $('#dayList');
  if (g){
    if (same && gridPos){ g.scrollLeft = gridPos[0]; g.scrollTop = gridPos[1]; }
    else {
      const first = bookings.filter(b => b.date === state.date && b.status !== 'cancelled' && b.kind === 'hourly').reduce((mm, b) => Math.min(mm, b.start), CLOSE);
      const target = state.date === TODAY && NOW_MIN > OPEN && NOW_MIN < CLOSE ? NOW_MIN - 60 : first - 30;
      g.scrollTop = Math.max(0, (target - OPEN) / STEP * SLOT);
    }
  }
  if (l2 && same) l2.scrollTop = listPos;
  if (!isDay) v.scrollTop = viewTop;
  syncBack();
}

/* =========================================================
   9. Шторки (формы)
   ========================================================= */
const sheetHead = (title, sub) => `<div class="grip" aria-hidden="true"></div><div class="sheet-head"><div><h2 id="sheetTitle">${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="icon-btn" data-action="close-sheet" aria-label="Закрыть">${ICON.close}</button></div>`;
const seg = (k, opts, cur, cls) => `<div class="seg${cls ? ' ' + cls : ''}" role="group">${opts.map(([v,l]) => `<button type="button" data-action="seg" data-k="${k}" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;

function openSheet(s){ if (sheet) stack.push(sheet); s._k = ++sheetKey; sheet = s; renderSheet(); }
function closeSheet(){ sheet = stack.pop() || null; renderSheet(); }
function replaceSheet(s){ s._k = ++sheetKey; sheet = s; renderSheet(); }

function renderSheet(){
  const root = $('#sheetRoot');
  if (!sheet){ root.innerHTML = ''; root.dataset.k = ''; syncBack(); return; }
  const prevBody = root.querySelector('.sheet-body');
  const fresh = !prevBody, same = root.dataset.k === String(sheet._k);
  const scroll = same && prevBody ? prevBody.scrollTop : 0;
  const build = {booking:bookingSheet, tenant:tenantSheet, tenantEdit:tenantEditSheet, resource:resourceSheet, priceAll:priceAllSheet, copy:copySheet, restore:restoreSheet, expense:expenseSheet, cats:catsSheet}[sheet.type];
  root.innerHTML = `<div class="scrim${fresh ? ' anim' : ''}" data-action="close-sheet"></div><div class="sheet${fresh ? ' anim' : ''}" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">${build()}</div>`;
  root.dataset.k = String(sheet._k);
  const nb = root.querySelector('.sheet-body'); if (nb) nb.scrollTop = scroll;
  if (!same){ const f = root.querySelector('.sheet-head .icon-btn'); if (f) f.focus({preventScroll:true}); }
  if (sheet.type === 'copy' && !same){ const ta = $('#copyText'); if (ta){ ta.focus(); ta.select(); } }
  if (sheet.type === 'cats' && !same && sheet.focusNew){ const n = $('#newCat'); if (n) n.focus(); }
  syncBack();
}

function recalc(){
  const d = sheet.d;
  if (d.kind === 'full_day'){ d.start = OPEN; d.end = CLOSE; }
  if (!d.priceManual) d.price = calcPrice(res(d.resourceId), d.kind, d.start, d.end);
}
function openNewBooking(p){
  p = p || {};
  const minD = cfg.minDur, vis = visibleRes();
  const resourceId = p.resourceId || (vis[0] || cfg.resources.find(r => r.active) || cfg.resources[0]).id;
  const date = p.date || TODAY;
  let start = p.start;
  if (start == null) start = date === TODAY && NOW_MIN >= OPEN && NOW_MIN < CLOSE - minD ? Math.ceil(NOW_MIN / STEP) * STEP : OPEN;
  start = Math.min(Math.max(start, OPEN), CLOSE - minD);
  const nextStart = Math.min(CLOSE, ...bookings.filter(b => b.resourceId === resourceId && b.date === date && b.status !== 'cancelled' && b.start > start).map(b => b.start));
  let end = Math.min(start + Math.max(60, minD), nextStart);
  if (end - start < minD) end = Math.min(CLOSE, start + minD);
  openSheet({type:'booking', isNew:true, confirm:false, tq:'', d:{id:null, tenantId:p.tenantId || null, resourceId, date, kind:'hourly', start, end, price:0, priceManual:false, payment:'unpaid', status:'active', comment:'', seriesId:null, repeat:0}});
  recalc(); renderSheet();
}
function openEditBooking(id){
  const b = bookings.find(x => x.id === id); if (!b) return;
  openSheet({type:'booking', isNew:false, confirm:false, tq:'', d:Object.assign({}, b, {repeat:0})});
}
function tenantPick(){
  const q = norm(sheet.tq);
  let list;
  if (q) list = tenants.filter(t => norm(`${t.name} ${t.phone} ${t.activity} ${t.tg}`).includes(q)).slice(0, 6);
  else {
    const cnt = {}; bookings.forEach(b => { cnt[b.tenantId] = (cnt[b.tenantId] || 0) + 1; });
    list = tenants.slice().sort((a, b) => (cnt[b.id] || 0) - (cnt[a.id] || 0)).slice(0, 5);
  }
  let h = list.map(t => `<button class="pick" data-action="pick-tenant" data-id="${t.id}">${avatar(t, 'sm')}<span class="lmain"><b>${esc(t.name)}</b><small>${esc(t.activity || 'Род занятий не указан')}</small></span></button>`).join('');
  if (q) h += `<button class="pick" data-action="create-tenant-inline"><span class="av sm plus" aria-hidden="true">+</span><span class="lmain"><b>Новый арендатор «${esc(sheet.tq.trim())}»</b><small>Телефон и заметку добавите в карточке</small></span></button>`;
  if (!h) h = '<div class="note">Начните вводить имя — можно сразу создать нового арендатора.</div>';
  return h;
}

function bookingSheet(){
  const s = sheet, d = s.d, r = res(d.resourceId), t = d.tenantId ? ten(d.tenantId) : null;
  const minD = cfg.minDur, len = d.end - d.start;
  const stored = d.id ? bookings.find(b => b.id === d.id) : null;
  const isCancelled = !!(stored && stored.status === 'cancelled');
  const cl = clash(d.resourceId, d.date, d.start, d.end, d.id);
  const tooShort = d.kind === 'hourly' && len < minD;
  const others = bookings.filter(b => b.id !== d.id && b.status !== 'cancelled' && b.resourceId === d.resourceId && b.date === d.date).sort((a,b) => a.start - b.start);
  const gaps = freeGaps(others).filter(([a,b]) => b - a >= minD);

  const tenantBlock = t
    ? `<div class="tchip">${avatar(t, 'sm')}<span class="lmain"><b>${esc(t.name)}</b><small>${esc(t.activity || '')}${t.phone ? ' · ' + esc(t.phone) : ''}</small></span><button type="button" class="link-btn" data-action="clear-tenant">Сменить</button></div>`
    : `<div class="search">${ICON.search}<input id="tSearch" type="search" placeholder="Имя или телефон" value="${esc(s.tq)}" autocomplete="off" aria-label="Найти арендатора"></div><div class="tpick" id="tPick">${tenantPick()}</div>`;
  const resOpts = KIND_ORDER.map(k => { const list = cfg.resources.filter(x => x.kind === k && (x.active || x.id === d.resourceId)); return list.length ? `<optgroup label="${KINDS[k].many}">${list.map(x => `<option value="${x.id}"${x.id === d.resourceId ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</optgroup>` : ''; }).join('');
  let startOpts = '', endOpts = '';
  for (let m = OPEN; m < CLOSE; m += STEP) if (m <= CLOSE - minD || m === d.start) startOpts += `<option value="${m}"${m === d.start ? ' selected' : ''}>${hm(m)}</option>`;
  for (let m = d.start + STEP; m <= CLOSE; m += STEP) if (m - d.start >= minD || m === d.end) endOpts += `<option value="${m}"${m === d.end ? ' selected' : ''}>${hm(m)} · ${durTxt(m - d.start)}</option>`;

  const pct = m => ((m - OPEN) / DAY_MIN * 100).toFixed(3) + '%';
  const wid = (a, b) => ((b - a) / DAY_MIN * 100).toFixed(3) + '%';
  const timeline = `<div class="field"><span class="lbl">${esc(r.name)} · ${shortDate(d.date)}</span>
    <div class="tl" aria-hidden="true">${others.map(b => `<i style="left:${pct(b.start)};width:${wid(b.start, b.end)}"></i>`).join('')}<i class="me${cl.length ? ' bad' : ''}" style="left:${pct(d.start)};width:${wid(d.start, d.end)}"></i></div>
    <div class="tl-scale" aria-hidden="true"><span>10</span><span>12</span><span>14</span><span>16</span><span>18</span><span>20</span><span>22</span></div>
    ${d.kind === 'hourly' ? `<div class="gaps">${gaps.length ? '<span>Свободно:</span>' + gaps.map(([a,b]) => `<button type="button" class="gap" data-action="use-gap" data-s="${a}" data-e="${b}">${hm(a)}–${hm(b)}</button>`).join('') : '<span>Свободных окон нет — выберите другое место или дату.</span>'}</div>` : ''}
  </div>`;
  const timeSection = d.kind === 'hourly'
    ? `<div class="row2"><div class="field"><label class="lbl" for="fStart">Начало</label><select id="fStart">${startOpts}</select></div><div class="field"><label class="lbl" for="fEnd">Конец</label><select id="fEnd">${endOpts}</select></div></div>`
    : `<div class="note">Весь день — 10:00–22:00. В эту дату место закрыто для других броней.</div>`;
  const alerts = (cl.length ? `<div class="alert" role="alert"><b>Время занято:</b> ${cl.map(c => `${esc(ten(c.tenantId).name)}, ${c.kind === 'full_day' ? 'весь день' : hm(c.start) + '–' + hm(c.end)}`).join('; ')}. Выберите свободное окно или другое место.</div>` : '')
    + (tooShort ? `<div class="alert" role="alert">Минимальная бронь — ${durTxt(minD)}.</div>` : '');

  let repeatField = '';
  if (s.isNew){
    let info = '';
    if (d.repeat > 1){
      const busy = [];
      for (let i = 1; i < d.repeat; i++){ const ds = addDays(d.date, 7*i), c = clash(d.resourceId, ds, d.start, d.end, null); if (c.length) busy.push([ds, c[0]]); }
      info = busy.length
        ? `<div class="note warn">Свободно ${d.repeat - busy.length} из ${d.repeat} дат. Занято: ${busy.map(([ds, c]) => `${shortDate(ds)} (${esc(shortName(ten(c.tenantId).name))}, ${c.kind === 'full_day' ? 'весь день' : hm(c.start) + '–' + hm(c.end)})`).join('; ')}. Эти даты пропустим.</div>`
        : `<div class="note">Все ${d.repeat} ${plural(d.repeat,'дата','даты','дат')} свободны, последняя — ${shortDate(addDays(d.date, 7*(d.repeat-1)))}.</div>`;
    }
    repeatField = `<div class="field"><span class="lbl">Повтор</span>${seg('repeat', [['off','Без повтора'],['on','Каждую неделю']], d.repeat > 1 ? 'on' : 'off')}${d.repeat > 1 ? `<div class="stepper"><button type="button" data-action="rep-dec" aria-label="Меньше недель">−</button><b>${d.repeat}</b><button type="button" data-action="rep-inc" aria-label="Больше недель">+</button><span>${plural(d.repeat,'неделя','недели','недель')} по ${DOW_DAT[parse(d.date).getDay()]}</span></div>${info}` : ''}</div>`;
  }
  const hourlyCost = Math.round(r.hour * len / 60);
  const priceField = `<div class="field"><span class="lbl">Стоимость${d.repeat > 1 ? ' одной брони' : ''}</span>
    <div class="price"><b id="priceVal">${rub(d.price)}</b><small>${d.priceManual ? 'своя цена' : d.kind === 'full_day' ? 'тариф «весь день»' : `${durTxt(len)} × ${rub(r.hour)}/ч`}</small></div>
    ${d.kind === 'hourly' && !d.priceManual && r.day && hourlyCost >= r.day ? `<div class="note">Весь день стоит ${rub(r.day)} — не дороже почасовой. <button type="button" class="link-btn" data-action="to-fullday">Перевести на весь день</button></div>` : ''}
    <label class="check"><input type="checkbox" id="fManual"${d.priceManual ? ' checked' : ''}>Своя цена: скидка или договорённость</label>
    ${d.priceManual ? `<input type="number" id="fPrice" inputmode="numeric" min="0" step="50" value="${d.price}" aria-label="Своя цена в рублях">` : ''}
  </div>`;

  const reason = !t ? 'Выберите арендатора' : cl.length ? 'Выбранное время занято' : tooShort ? `Минимальная бронь — ${durTxt(minD)}` : '';
  let footer;
  if (isCancelled){
    footer = `<button class="btn" data-action="restore-booking"${cl.length ? ' disabled' : ''}>Восстановить бронь</button>${cl.length ? '<p class="foot-hint">Время уже занято другой бронью</p>' : ''}`;
  } else if (s.confirm){
    footer = `<div class="confirm"><p>Отменить бронь?</p>${d.seriesId
      ? `<button class="btn danger solid" data-action="cancel-series">Эту и следующие в серии</button><button class="btn danger" data-action="cancel-one">Только эту</button>`
      : `<button class="btn danger solid" data-action="cancel-one">Да, отменить</button>`}<button class="btn ghost" data-action="cancel-back">Не отменять</button></div>`;
  } else {
    const label = s.isNew ? (d.repeat > 1 ? `Записать на ${d.repeat} ${plural(d.repeat,'неделю','недели','недель')}` : 'Записать') : 'Сохранить';
    footer = `<button class="btn" data-action="save-booking"${reason ? ' disabled' : ''}>${label}</button>${reason ? `<p class="foot-hint">${reason}</p>` : ''}${s.isNew ? '' : '<button class="btn quiet-danger" data-action="ask-cancel">Отменить бронь</button>'}`;
  }
  const sub = `${esc(r.name)} · ${dowDate(d.date)}${d.date < TODAY ? ' · прошедшая дата' : ''}${d.seriesId ? ' · серия' : ''}${isCancelled ? ' · отменена' : ''}`;
  return sheetHead(s.isNew ? 'Новая бронь' : 'Бронь', sub) + `<div class="sheet-body">
    <div class="field"><span class="lbl">Арендатор</span>${tenantBlock}</div>
    <div class="row2">
      <div class="field"><label class="lbl" for="fRes">Место</label><select id="fRes">${resOpts}</select></div>
      <div class="field"><label class="lbl" for="fDate">Дата</label><input type="date" id="fDate" value="${d.date}"></div>
    </div>
    <div class="field"><span class="lbl">Тариф</span>${seg('kind', [['hourly','Почасовая'],['full_day','Весь день']], d.kind)}</div>
    ${timeSection}${timeline}${alerts}${repeatField}${priceField}
    <div class="field"><span class="lbl">Оплата</span>${seg('payment', [['unpaid','Не оплачено'],['cash','Наличные'],['card','Карта'],['transfer','Перевод']], d.payment, 'pay')}</div>
    ${!s.isNew && !isCancelled ? `<div class="field"><span class="lbl">Посещение</span>${seg('status', [['active','Состоялась'],['no_show','Не пришёл']], d.status)}</div>` : ''}
    <div class="field"><label class="lbl" for="fComment">Комментарий</label><textarea id="fComment" placeholder="Например: нужен второй стул, придут двое">${esc(d.comment)}</textarea></div>
  </div><div class="sheet-foot">${footer}</div>`;
}

function saveBooking(){
  const d = sheet.d, minD = cfg.minDur;
  if (!d.tenantId){ toast('Выберите арендатора'); return; }
  if (d.kind === 'hourly' && d.end - d.start < minD){ toast(`Минимальная бронь — ${durTxt(minD)}`); return; }
  if (clash(d.resourceId, d.date, d.start, d.end, d.id).length){ toast('Время занято'); return; }
  const fields = x => ({tenantId:x.tenantId, resourceId:x.resourceId, date:x.date, kind:x.kind, start:x.start, end:x.end, price:x.price, priceManual:x.priceManual, payment:x.payment, status:x.status, comment:x.comment});
  const changed = [], moved = [];
  if (sheet.isNew){
    const n = d.repeat > 1 ? d.repeat : 1, seriesId = n > 1 ? newId('s') : null, skipped = [];
    for (let i = 0; i < n; i++){
      const date = addDays(d.date, 7*i);
      if (clash(d.resourceId, date, d.start, d.end, null).length){ skipped.push(date); continue; }
      const b = Object.assign({id:newId('b'), seriesId}, fields(d), {date});
      bookings.push(b); changed.push(b);
    }
    toast(n > 1 ? `Создано ${changed.length} из ${n}${skipped.length ? '. Пропущено: ' + skipped.map(shortDate).join(', ') : ''}` : 'Бронь создана');
  } else {
    const b = bookings.find(x => x.id === d.id), oldM = mkey(b.date);

    changed.push(b);
    toast('Изменения сохранены');
  }
  haptic('success'); closeSheet(); render();
  persistBookings(changed, moved);
}

function saveExpense(){
  const s = sheet, e = s.e, amount = Math.round(+e.amount || 0);
  if (!(amount > 0)){ toast('Укажите сумму'); const i = $('#eAmount'); if (i) i.focus(); return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)){ toast('Укажите дату'); return; }
  const day = +e.date.slice(8), note = String(e.note || '').trim();
  if (e.rec){
    if (s.isNew){
      const r = {id:newId('r'), cat:e.cat, amount, note, day, from:e.date.slice(0,7), to:null};
      recurring.push(r); persistRecurring([r]);
    } else {
      const r = recurring.find(x => x.id === e.id);
      if (r.from >= s.ym){ Object.assign(r, {cat:e.cat, amount, note, day}); persistRecurring([r]); }
      else {   // разделяем: старая сумма — до прошлого месяца, новая — с текущего
        const nr = {id:newId('r'), cat:e.cat, amount, note, day, from:s.ym, to:r.to};
        r.to = prevYm(s.ym); recurring.push(nr); persistRecurring([r, nr]);
      }
    }
  } else if (s.isNew){
    const x = {id:newId('e'), date:e.date, cat:e.cat, amount, note};
    expenses.push(x); persistExpense(x);
  } else {
    const x = expenses.find(z => z.id === e.id), oldM = ekey(x.date);
    Object.assign(x, {date:e.date, cat:e.cat, amount, note});
    persistExpense(x, false, oldM !== ekey(x.date) ? oldM : null);
  }
  toast(s.isNew ? 'Расход добавлен' : 'Расход сохранён'); haptic('success');
  closeSheet(); render();
}
function deleteExpense(){
  const s = sheet, e = s.e;
  if (e.rec){
    const r = recurring.find(x => x.id === e.id), to = prevYm(s.ym);
    if (to < r.from){ recurring = recurring.filter(x => x.id !== r.id); persistRecurring([], [r.id]); }
    else { r.to = to; persistRecurring([r]); }
    toast(`Больше не повторяется, начиная с: ${ymFrom(s.ym)}`);
  } else {
    const x = expenses.find(z => z.id === e.id);
    expenses = expenses.filter(z => z.id !== e.id);
    persistExpense(x, true);
    toast('Расход удалён');
  }
  haptic('success'); closeSheet(); render();
}

/* Копирование: внутри обработчика нажатия; не вышло — показываем текст для ручного копирования */
function copyText(text, title, okMsg){
  const fallback = () => openSheet({type:'copy', title, text});
  try {
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => { toast(okMsg); haptic('success'); }, fallback);
    else fallback();
  } catch(e){ fallback(); }
}
const backupJSON = () => JSON.stringify({app:'coworking', v:2, exportedAt:new Date().toISOString(), minDur:cfg.minDur, resources:cfg.resources, cats:cfg.cats, tenants, bookings, expenses, recurring});
function parseBackup(text){
  let o;
  try { o = JSON.parse(text); } catch(e){ throw new Error('Текст не похож на резервную копию: не читается как JSON.'); }
  if (!o || o.app !== 'coworking' || !Array.isArray(o.resources) || !Array.isArray(o.tenants) || !Array.isArray(o.bookings)) throw new Error('Это не резервная копия расписания.');
  const bad = o.bookings.find(b => !b.id || !/^\d{4}-\d{2}-\d{2}$/.test(b.date) || !(b.end > b.start));
  if (bad) throw new Error('В копии есть повреждённая бронь: ' + JSON.stringify(bad).slice(0, 80));
  o.expenses = Array.isArray(o.expenses) ? o.expenses : [];
  o.recurring = Array.isArray(o.recurring) ? o.recurring : [];
  return o;
}
function applyBackup(o){
  persist(async () => {
    await kv.del(await kv.keys());
    cfg = {minDur:o.minDur || 60, resources:o.resources, cats:Array.isArray(o.cats) && o.cats.length ? o.cats : defaultCats()};
    tenants = o.tenants; bookings = o.bookings; expenses = o.expenses; recurring = o.recurring;
    await writeBlob('cfg', encCfg());
    await writeBlob('ten', encTen(tenants));
    if (recurring.length) await writeBlob('rex', encRec(recurring));
    const byMonth = {}, byExp = {};
    bookings.forEach(b => (byMonth[mkey(b.date)] = byMonth[mkey(b.date)] || []).push(b));
    expenses.forEach(e => (byExp[ekey(e.date)] = byExp[ekey(e.date)] || []).push(e));
    for (const mk in byMonth) await writeBlob(mk, encMonth(byMonth[mk]));
    for (const ek in byExp) await writeBlob(ek, encExp(byExp[ek]));
    await loadAll();
    toast('Данные восстановлены'); render();
  });
}

}

  const el = e.target.closest('[data-action],[data-tab]');
  if (!el || !state.ready) return;
  if (el.dataset.tab){ state.tab = el.dataset.tab; render(); return; }
  const a = el.dataset.action, d = sheet && sheet.d;
  switch (a){
    case 'fab': {
      if (state.tab === 'schedule'){
        let date = state.date;
        if (state.mode === 'month'){ const inMonth = now.getFullYear() === state.y && now.getMonth() === state.m; date = inMonth ? TODAY : ymd(new Date(state.y, state.m, 1)); }
        openNewBooking({date});
      } else if (state.tab === 'tenants') openSheet({type:'tenantEdit', id:null, prefill:state.tq.trim()});
      else if (state.tab === 'finance') openExpense();
      else openSheet({type:'resource', id:null});
      break; }
    case 'month-prev': case 'month-next': { const dt = new Date(state.y, state.m + (a === 'month-next' ? 1 : -1), 1); state.y = dt.getFullYear(); state.m = dt.getMonth(); render(); break; }
    case 'go-today': state.date = TODAY; syncMonth(); render(); break;
    case 'go-finance': state.tab = 'finance'; state.fin = 'summary'; state.ay = now.getFullYear(); state.am = now.getMonth(); render(); break;
    case 'filter': state.filter = el.dataset.v; render(); break;
    case 'open-day': state.date = el.dataset.date; state.mode = 'day'; syncMonth(); render(); break;
    case 'pick-day': state.date = el.dataset.date; syncMonth(); render(); break;
    case 'back-month': state.mode = 'month'; syncMonth(); render(); break;
    case 'day-prev': state.date = addDays(state.date, -1); syncMonth(); render(); break;
    case 'day-next': state.date = addDays(state.date, 1); syncMonth(); render(); break;
    case 'day-view': state.dayView = el.dataset.v; render(); break;
    case 'slot': { const rect = el.getBoundingClientRect(), slot = Math.max(0, Math.floor((e.clientY - rect.top) / SLOT)); openNewBooking({resourceId:el.dataset.res, date:state.date, start:OPEN + slot*STEP}); break; }
    case 'edit-booking': openEditBooking(el.dataset.id); break;
    case 'close-sheet': closeSheet(); break;

    case 'seg': {
      const k = el.dataset.k, v = el.dataset.v;
      if (k === 'kind'){
        if (v === d.kind) break;
        if (v === 'full_day') d._h = [d.start, d.end];
        else { const h = d._h || [OPEN, OPEN + Math.max(60, cfg.minDur)]; d.start = h[0]; d.end = h[1]; }
        d.kind = v;
      } else if (k === 'repeat') d.repeat = v === 'on' ? 4 : 0;
      else d[k] = v;
      recalc(); renderSheet(); break; }
    case 'to-fullday': d._h = [d.start, d.end]; d.kind = 'full_day'; recalc(); renderSheet(); break;
    case 'use-gap': { const s = +el.dataset.s, g = +el.dataset.e, len = Math.max(d.end - d.start, cfg.minDur); d.start = s; d.end = Math.min(g, s + len); recalc(); renderSheet(); break; }
    case 'rep-dec': d.repeat = Math.max(2, d.repeat - 1); renderSheet(); break;
    case 'rep-inc': d.repeat = Math.min(12, d.repeat + 1); renderSheet(); break;
    case 'pick-tenant': d.tenantId = el.dataset.id; sheet.tq = ''; renderSheet(); break;
    case 'create-tenant-inline': {
      const t = {id:newId('t'), name:sheet.tq.trim(), activity:'', phone:'', tg:'', note:''};
      tenants.push(t); d.tenantId = t.id; sheet.tq = ''; toast('Арендатор добавлен в базу'); renderSheet(); persistTenant(t); break; }
    case 'clear-tenant': d.tenantId = null; renderSheet(); { const i = $('#tSearch'); if (i) i.focus(); } break;
    case 'save-booking': saveBooking(); break;
    case 'ask-cancel': sheet.confirm = true; renderSheet(); break;
    case 'cancel-back': sheet.confirm = false; renderSheet(); break;
    case 'cancel-one': setStatus([d.id], 'cancelled', 'Бронь отменена'); break;
    case 'cancel-series': { const ids = bookings.filter(b => b.seriesId === d.seriesId && b.date >= d.date && b.status === 'active').map(b => b.id); setStatus(ids, 'cancelled', `Отменено броней: ${ids.length}`); break; }
    case 'restore-booking': setStatus([d.id], 'active', 'Бронь восстановлена'); break;

    case 'open-tenant': openSheet({type:'tenant', id:el.dataset.id}); break;
    case 'new-tenant': openSheet({type:'tenantEdit', id:null, prefill:state.tq.trim()}); break;
    case 'edit-tenant': openSheet({type:'tenantEdit', id:sheet.id}); break;
    case 'book-tenant': openNewBooking({tenantId:sheet.id, date:NOW_MIN >= CLOSE - cfg.minDur ? addDays(TODAY, 1) : TODAY}); break;
    case 'save-tenant': {
      const name = $('#tName').value.trim();
      if (!name){ toast('Укажите имя арендатора'); $('#tName').focus(); break; }
      const data = {name, activity:$('#tAct').value.trim(), phone:$('#tPhone').value.trim(), tg:$('#tTg').value.trim().replace(/^@+/, ''), note:$('#tNote').value.trim()};
      let t;
      if (sheet.id){ t = ten(sheet.id); Object.assign(t, data); toast('Карточка обновлена'); closeSheet(); }
      else { t = Object.assign({id:newId('t')}, data); tenants.push(t); toast('Арендатор добавлен'); replaceSheet({type:'tenant', id:t.id}); }
      haptic('success'); render(); persistTenant(Object.assign({}, t)); break; }

    case 'open-resource': openSheet({type:'resource', id:el.dataset.id}); break;
    case 'save-resource': {
      const name = $('#rName').value.trim();
      if (!name){ toast('Укажите название'); $('#rName').focus(); break; }
      const data = {name, kind:$('#rKind').value, note:$('#rNote').value.trim(), hour:Math.max(0, Math.round(+$('#rHour').value || 0)), day:Math.max(0, Math.round(+$('#rDay').value || 0)), active:$('#rActive').checked};
      if (sheet.id){
        const future = bookings.filter(b => b.resourceId === sheet.id && b.date >= TODAY && b.status === 'active').length;
        if (!data.active && future){ toast(`Сначала перенесите или отмените ${future} ${plural(future,'бронь','брони','броней')}`); break; }
        Object.assign(res(sheet.id), data);
      } else cfg.resources.push(Object.assign({id:newId('r')}, data));
      toast('Место сохранено'); haptic('success'); closeSheet(); render(); persistCfg(); break; }
    case 'price-all': openSheet({type:'priceAll'}); break;
    case 'save-price-all': {
      const hour = Math.max(0, Math.round(+$('#paHour').value || 0)), day = Math.max(0, Math.round(+$('#paDay').value || 0));
      cfg.resources.forEach(r => { r.hour = hour; r.day = day; });
      toast(`Цена обновлена: ${rub(hour)}/ч, ${rub(day)} за день`); haptic('success'); closeSheet(); render(); persistCfg(); break; }

    case 'fin': state.fin = el.dataset.v; render(); break;
    case 'skin': skinPref = el.dataset.v; try { localStorage.setItem('cw-skin-v2', skinPref); } catch(err){} applySkin(); render(); break;
    case 'an-prev': case 'an-next': { const dt = new Date(state.ay, state.am + (a === 'an-next' ? 1 : -1), 1); state.ay = dt.getFullYear(); state.am = dt.getMonth(); render(); break; }
    case 'an-today': state.ay = now.getFullYear(); state.am = now.getMonth(); render(); break;
    case 'edit-exp': openExpense('one', el.dataset.id); break;
    case 'edit-rec': openExpense('rec', el.dataset.id); break;
    case 'ecat': sheet.e.cat = +el.dataset.v; renderSheet(); break;
    case 'exp-add-cat': openExpense(null, null, +el.dataset.id); break;
    case 'cat-manage': openCats(false); break;
    case 'cat-new': openCats(true); break;
    case 'cat-add': {
      syncCats();
      const name = sheet.newName.trim();
      if (!name){ toast('Впишите название статьи'); $('#newCat').focus(); break; }
      if (sheet.cats.some(c => norm(c.name.trim()) === norm(name))){ toast('Такая статья уже есть'); break; }
      const id = Math.max(-1, ...sheet.cats.map(c => c.id), ...cfg.cats.map(c => c.id)) + 1;
      sheet.cats.push({id, name, hidden:false}); sheet.added = id; sheet.newName = '';
      renderSheet(); { const n = $('#newCat'); if (n) n.focus(); } break; }
    case 'cat-del': {
      syncCats();
      const id = +el.dataset.id, c = sheet.cats.find(x => x.id === id);
      if (catUsed(id)){ c.hidden = true; toast('По статье есть расходы — она скрыта с экрана'); }
      else { sheet.cats = sheet.cats.filter(x => x.id !== id); if (sheet.added === id) sheet.added = null; }
      renderSheet(); break; }
    case 'cat-restore': { syncCats(); const c = sheet.cats.find(x => x.id === +el.dataset.id); if (c) c.hidden = false; renderSheet(); break; }
    case 'cat-up': {
      syncCats();
      const list = sheet.cats, i = list.findIndex(x => x.id === +el.dataset.id);
      let j = i - 1; while (j >= 0 && list[j].hidden) j--;
      if (j >= 0){ const t = list[i]; list[i] = list[j]; list[j] = t; }
      renderSheet(); break; }
    case 'save-cats': {
      syncCats();
      if (sheet.newName.trim()){ toast('Нажмите «Добавить», чтобы сохранить новую статью'); $('#newCat').focus(); break; }
      if (sheet.cats.some(c => !c.name.trim())){ toast('У каждой статьи должно быть название'); break; }
      cfg.cats = sheet.cats.map(c => ({id:c.id, name:c.name.trim(), hidden:!!c.hidden}));
      const added = sheet.added;
      persistCfg(); toast('Статьи сохранены'); haptic('success');
      closeSheet();
      if (sheet && sheet.type === 'expense' && added != null){ sheet.e.cat = added; renderSheet(); }
      render(); break; }
    case 'save-expense': saveExpense(); break;
    case 'exp-ask': sheet.confirm = true; renderSheet(); break;
    case 'exp-back': sheet.confirm = false; renderSheet(); break;
    case 'exp-delete': deleteExpense(); break;
    case 'copy-csv': copyText(analyticsCSV(state.ay, state.am), `Отчёт: ${MONTHS[state.am].toLowerCase()} ${state.ay}`, 'Отчёт скопирован — вставьте в Excel или Google Таблицы'); break;
    case 'backup': copyText(backupJSON(), 'Резервная копия', 'Копия в буфере — вставьте её в «Избранное» Telegram'); break;
    case 'restore-open': openSheet({type:'restore', text:'', parsed:null, error:''}); break;
    case 'restore-check': { sheet.text = $('#restoreText').value; try { sheet.parsed = parseBackup(sheet.text); sheet.error = ''; } catch(err){ sheet.parsed = null; sheet.error = err.message; } renderSheet(); break; }
    case 'restore-apply': { const o = sheet.parsed; sheet = null; stack.length = 0; renderSheet(); applyBackup(o); break; }
  }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'sMin'){ cfg.minDur = +e.target.value; toast(`Минимальная бронь: ${durTxt(cfg.minDur)}`); persistCfg(); return; }
  if (!sheet) return;
  if (sheet.type === 'expense'){
    if (id === 'eDate' && e.target.value){ sheet.e.date = e.target.value; renderSheet(); }
    else if (id === 'eRec'){ sheet.e.rec = e.target.checked; renderSheet(); }
    return;
  }
  if (sheet.type !== 'booking') return;
  const d = sheet.d;
  switch (id){
    case 'fRes': d.resourceId = e.target.value; recalc(); renderSheet(); break;
    case 'fDate': if (e.target.value){ d.date = e.target.value; renderSheet(); } break;
    case 'fStart': { const len = d.end - d.start; d.start = +e.target.value; d.end = Math.min(CLOSE, d.start + Math.max(len, cfg.minDur)); recalc(); renderSheet(); break; }
    case 'fEnd': d.end = +e.target.value; recalc(); renderSheet(); break;
    case 'fManual': d.priceManual = e.target.checked; recalc(); renderSheet(); if (d.priceManual){ const p = $('#fPrice'); if (p) p.focus(); } break;
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'tq'){ state.tq = e.target.value; $('#tList').innerHTML = tenantRows(); }
  else if (id === 'tSearch' && sheet){ sheet.tq = e.target.value; $('#tPick').innerHTML = tenantPick(); }
  else if (id === 'fPrice' && sheet){ sheet.d.price = Math.max(0, Math.round(+e.target.value || 0)); $('#priceVal').textContent = rub(sheet.d.price); }
  else if (id === 'fComment' && sheet){ sheet.d.comment = e.target.value; }
  else if (id === 'restoreText' && sheet){ sheet.text = e.target.value; }
  else if (id === 'eAmount' && sheet){ sheet.e.amount = e.target.value; }
  else if (id === 'eNote' && sheet){ sheet.e.note = e.target.value; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

/* =========================================================
   12. Запуск
   ========================================================= */
async function boot(){
  initTelegram();
  updateSync();
  try {
    if (kv.mode === 'demo') await seedDemo();
    await loadAll();
    state.ready = true;
    render();
  } catch(err){
    $('#view').innerHTML = `<div class="empty"><p>Не удалось загрузить данные из Telegram: ${esc(err.message || err)}</p><button class="btn" id="retry">Повторить</button></div>`;
    $('#retry').onclick = () => location.reload();
  }
}
boot();
})();
</script>
