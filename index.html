<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2161">
<title>Расписание коворкинга</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: phone column (max 480px) on a deep-violet glow field. Glass cards, violet gradient hero cards (ref. photos 1, 2, 4),
   floating pill tab bar + round action button (ref. photo 3). One dark look by design — no light theme. */
:root{
  /* Светлая тема: фон и поверхности светлые, фиолетовые детали без изменений */
  --bg:#F3F1FA; --glow-1:rgba(139,108,255,.24); --glow-2:rgba(160,120,255,.14); --glow-3:rgba(110,80,230,.08);
  --sheet-top:#FFFFFF; --sheet:#FBFAFF; --sheet-2:#F5F3FC; --opt-bg:#FFFFFF;
  --glass:rgba(255,255,255,.78); --glass-2:rgba(124,92,255,.09); --glass-line:rgba(70,45,160,.10); --glass-line-2:rgba(70,45,160,.18);
  --card-grad:linear-gradient(180deg,#FFFFFF,rgba(255,255,255,.86)); --row-bg:#FFFFFF; --row-bg-2:#F8F6FF; --field-bg:#FFFFFF;
  --cell-bg:rgba(255,255,255,.85); --cell-line:rgba(70,45,160,.08); --track:rgba(70,45,160,.08); --dash:rgba(70,45,160,.22);
  --grid-bg:#FFFFFF; --grid-head:#FFFFFF; --grid-rail:#FBFAFF; --grid-hour:rgba(70,45,160,.13); --grid-q:rgba(70,45,160,.05);
  --stripe:rgba(70,45,160,.06); --tl-busy:rgba(70,45,160,.16); --dock-bg:rgba(255,255,255,.88); --scrim:rgba(28,18,64,.32); --toast-bg:rgba(29,22,56,.94);
  --act-bg:linear-gradient(180deg,rgba(139,108,255,.16),rgba(139,108,255,.04)); --act-line:rgba(124,92,255,.22);
  --shadow-card:0 10px 28px rgba(70,45,160,.08); --shadow-row:0 4px 14px rgba(70,45,160,.05); --shadow-dock:0 12px 32px rgba(70,45,160,.18); --shadow-sheet:0 -14px 40px rgba(40,25,100,.16);
  --ink:#1C1535; --muted:#675F8E; --faint:#9790B8;
  --violet:#7357F0; --violet-2:#6A4BE8; --violet-3:#4A2DC4; --lilac:#C9B8FF; --link:#6142E6; --line-accent:#7C5CFF; --mk:#6A4BE8;
  --cab:#7C5CFF; --sty:#C24FDC; --bar:#3E6FE8;
  --cab-a:rgba(124,92,255,.13); --sty-a:rgba(194,79,220,.12); --bar-a:rgba(62,111,232,.12);
  --cab-b:rgba(124,92,255,.30); --sty-b:rgba(194,79,220,.30); --bar-b:rgba(62,111,232,.30);
  --ok:#1E9E62; --warn:#C98512; --danger:#E0456A; --danger-a:rgba(224,69,106,.09);
  --heat-max:.62;
  --grad:linear-gradient(160deg,#B9A4FF 0%,#8B6CFF 42%,#5A3BD6 100%);
  --grad-btn:linear-gradient(160deg,#9D82FF 0%,#6A4BE8 100%);
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --slot:20px;
  color-scheme:light;
}
:root[data-skin="dark"]{
  --bg:#0A0716; --glow-1:rgba(124,92,255,.48); --glow-2:rgba(86,52,214,.30); --glow-3:rgba(60,30,160,.22);
  --sheet-top:#1C1638; --sheet:#151029; --sheet-2:#110D22; --opt-bg:#1C1638;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --glass-line:rgba(255,255,255,.09); --glass-line-2:rgba(255,255,255,.18);
  --card-grad:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035)); --row-bg:rgba(255,255,255,.05); --row-bg-2:rgba(255,255,255,.08); --field-bg:rgba(255,255,255,.05);
  --cell-bg:rgba(255,255,255,.035); --cell-line:rgba(255,255,255,.06); --track:rgba(255,255,255,.07); --dash:rgba(255,255,255,.18);
  --grid-bg:rgba(255,255,255,.035); --grid-head:#151129; --grid-rail:#120E24; --grid-hour:rgba(255,255,255,.10); --grid-q:rgba(255,255,255,.035);
  --stripe:rgba(255,255,255,.07); --tl-busy:rgba(255,255,255,.18); --dock-bg:rgba(24,19,44,.78); --scrim:rgba(5,3,14,.6); --toast-bg:rgba(36,28,66,.96);
  --act-bg:linear-gradient(180deg,rgba(139,108,255,.20),rgba(139,108,255,.06)); --act-line:rgba(185,164,255,.22);
  --shadow-card:none; --shadow-row:none; --shadow-dock:0 12px 32px rgba(0,0,0,.5); --shadow-sheet:0 -14px 40px rgba(0,0,0,.55);
  --ink:#F4F1FF; --muted:#A79FCB; --faint:#6E6794;
  --violet:#8B6CFF; --link:#C9B8FF; --line-accent:#B9A4FF; --mk:#FFFFFF;
  --cab:#9A7BFF; --sty:#E070F0; --bar:#5E8EFF;
  --cab-a:rgba(154,123,255,.22); --sty-a:rgba(224,112,240,.22); --bar-a:rgba(94,142,255,.22);
  --cab-b:rgba(154,123,255,.25); --sty-b:rgba(224,112,240,.25); --bar-b:rgba(94,142,255,.25);
  --ok:#5FD39A; --warn:#F2B35B; --danger:#FF6B86; --danger-a:rgba(255,107,134,.14);
  --heat-max:.75;
  color-scheme:dark;
}
:root[data-skin="dusk"]{
  /* Сумерки: насыщенный фиолетовый фон, светлое матовое стекло, белый текст */
  --bg:#2A2161; --glow-1:rgba(139,108,255,.55); --glow-2:rgba(110,80,230,.40); --glow-3:rgba(80,60,190,.35);
  --sheet-top:#40348C; --sheet:#342A77; --sheet-2:#2C2366; --opt-bg:#342A77;
  --glass:rgba(255,255,255,.10); --glass-2:rgba(255,255,255,.14); --glass-line:rgba(255,255,255,.14); --glass-line-2:rgba(255,255,255,.24);
  --card-grad:linear-gradient(180deg,rgba(255,255,255,.15),rgba(255,255,255,.07)); --row-bg:rgba(255,255,255,.09); --row-bg-2:rgba(255,255,255,.13); --field-bg:rgba(255,255,255,.09);
  --cell-bg:rgba(255,255,255,.07); --cell-line:rgba(255,255,255,.10); --track:rgba(255,255,255,.13); --dash:rgba(255,255,255,.26);
  --grid-bg:rgba(255,255,255,.06); --grid-head:#3A2F80; --grid-rail:#342A77; --grid-hour:rgba(255,255,255,.16); --grid-q:rgba(255,255,255,.06);
  --stripe:rgba(255,255,255,.08); --tl-busy:rgba(255,255,255,.24); --dock-bg:rgba(52,42,119,.80); --scrim:rgba(14,9,40,.5); --toast-bg:rgba(24,18,60,.95);
  --act-bg:linear-gradient(180deg,rgba(185,164,255,.26),rgba(185,164,255,.08)); --act-line:rgba(201,184,255,.30);
  --shadow-card:0 10px 28px rgba(12,6,40,.18); --shadow-row:none; --shadow-dock:0 12px 32px rgba(12,6,40,.45); --shadow-sheet:0 -14px 40px rgba(12,6,40,.45);
  --ink:#FFFFFF; --muted:#CBC3F0; --faint:#9A90CC;
  --violet:#B39DFF; --link:#D9CDFF; --line-accent:#D2C4FF; --mk:#FFFFFF;
  --cab:#B39DFF; --sty:#F08CFA; --bar:#86AAFF;
  --cab-a:rgba(179,157,255,.26); --sty-a:rgba(240,140,250,.24); --bar-a:rgba(134,170,255,.24);
  --cab-b:rgba(179,157,255,.35); --sty-b:rgba(240,140,250,.35); --bar-b:rgba(134,170,255,.35);
  --ok:#7BE3AE; --warn:#FFC56B; --danger:#FF7E97; --danger-a:rgba(255,126,151,.16);
  --heat-max:.8;
  color-scheme:dark;
}
.rule.stack{flex-direction:column;align-items:stretch;gap:8px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(130% 55% at 50% -12%,var(--glow-1),transparent 62%),radial-gradient(90% 45% at 110% 105%,var(--glow-2),transparent 65%),radial-gradient(70% 40% at -20% 60%,var(--glow-3),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}

.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font:700 15px var(--font);color:#fff;box-shadow:0 6px 18px rgba(124,92,255,.45)}
.brand b{font:600 16px/1 var(--font);letter-spacing:.01em;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--font);padding:7px 11px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.ok::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync.busy::before{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.sync.err{color:var(--danger)}
.sync.err::before{background:var(--danger)}
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:4px 104px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.is-day{display:flex;flex-direction:column;padding-bottom:96px}
.loading{padding:80px 8px;text-align:center;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);line-height:1.5}

/* Dock (photo 3) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.dock-in{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:448px}
.tabs{flex:1;display:flex;justify-content:space-around;align-items:center;height:64px;padding:0 6px;border-radius:32px;background:var(--dock-bg);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-dock)}
.tabs button{width:50px;height:50px;display:grid;place-items:center;color:var(--muted);position:relative;border-radius:18px;transition:color .15s}
.tabs svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--violet)}
.tabs button[aria-current="page"]::after{content:"";position:absolute;bottom:5px;left:50%;width:16px;height:3px;border-radius:2px;background:var(--violet);transform:translateX(-50%);box-shadow:0 0 8px var(--violet)}
.fab{width:64px;height:64px;border-radius:50%;flex:none;background:var(--grad-btn);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(124,92,255,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.fab svg{width:26px;height:26px}

/* Shared */
.glass{background:var(--card-grad);border:1px solid var(--glass-line);border-radius:22px;box-shadow:var(--shadow-card)}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:13px;background:var(--glass);border:1px solid var(--glass-line);flex:none;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.pill-btn{height:32px;padding:0 12px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);font:600 12.5px var(--font);color:var(--link);white-space:nowrap}
.link-btn{color:var(--link);font-weight:600;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 18px;border-radius:18px;background:var(--grad-btn);color:#fff;font:600 15.5px var(--font);width:100%;text-align:center;box-shadow:0 10px 24px rgba(124,92,255,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.btn svg{width:18px;height:18px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-line);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none}
.btn.danger.solid{background:var(--danger);color:#fff;border:0}
.btn.quiet-danger{background:transparent;color:var(--danger);box-shadow:none;height:42px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 13px;border-radius:11px;background:var(--glass);border:1px solid var(--glass-line);font:600 12.5px var(--font);color:var(--muted);white-space:nowrap;flex:none;letter-spacing:.01em}
.chip[aria-pressed="true"]{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.35)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:15px;background:var(--glass);border:1px solid var(--glass-line)}
.seg button{height:36px;border-radius:11px;font:600 13px var(--font);color:var(--muted);padding:0 8px;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--grad-btn);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.35)}
.seg.pay{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.mini{padding:3px;border-radius:12px;flex:none}
.seg.mini button{height:30px;font-size:12.5px;border-radius:9px;padding:0 12px}
.seg.mini.icons button{width:36px;padding:0;display:grid;place-items:center}
.seg.mini.icons svg{width:17px;height:17px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 10px}
.sec-h h2{font:600 17px/1.2 var(--font)}
.sec-h small{font:500 12.5px var(--font);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--cab);display:inline-block}
.dot.sty{background:var(--sty)}
.dot.bar{background:var(--bar)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--font);flex:none;color:#fff;background:linear-gradient(160deg,hsl(var(--h) 70% 66%),hsl(calc(var(--h) + 30) 62% 44%))}
.av.big{width:56px;height:56px;font-size:18px}
.av.sm{width:32px;height:32px;font-size:11.5px}
.av.plus{background:var(--glass-2);color:var(--link);border:1px dashed var(--glass-line-2);font-size:18px}
.ptitle{margin:6px 2px 14px;font:300 30px/1.1 var(--font);letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.ptitle span{font:500 14px var(--font);color:var(--muted)}

/* Home (photo 1) */
.greet{margin:10px 0 6px;text-align:center;font:500 14px var(--font);color:var(--muted);position:relative}
.greet::before{content:"";position:absolute;left:50%;top:50%;width:120px;height:40px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(160,130,255,.30),transparent);pointer-events:none}
.hero{text-align:center;font:300 31px/1.18 var(--font);letter-spacing:-.015em;margin-bottom:20px}
.hero b{font-weight:500}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.act{position:relative;height:186px;padding:14px 14px 12px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;background:var(--act-bg);border:1px solid var(--act-line);text-align:left;box-shadow:var(--shadow-card)}
.act-h{display:flex;justify-content:space-between;align-items:center;font:600 15px var(--font)}
.act-h svg{width:16px;height:16px;color:var(--muted)}
.act > small{font:500 12px var(--font);color:var(--muted);margin-top:1px}
.act-v{margin-top:auto;display:flex;align-items:baseline;gap:5px;position:relative}
.act-v b{font:300 40px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.act-v small{font:500 13px var(--font);color:var(--muted)}
.hbars{position:absolute;left:14px;right:14px;top:56px;height:60px;display:flex;align-items:flex-end;gap:5px}
.hbars i{flex:1;border-radius:3px;background:linear-gradient(180deg,#C9B8FF,#7C5CFF);opacity:.9;min-height:3px}
.hbars i.past{opacity:.35}
.spark{position:absolute;left:0;right:0;top:46px;width:100%;height:84px;overflow:visible}
.spark .ln{fill:none;stroke:var(--line-accent);stroke-width:2;filter:drop-shadow(0 0 5px rgba(160,130,255,.9))}
.spark .mk{fill:var(--mk);filter:drop-shadow(0 0 6px var(--mk))}
.calcard{padding:14px 12px 12px}
.mhead{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.mtitle{flex:1;font:500 19px/1.1 var(--font);min-width:0}
.mtitle span{color:var(--muted);font-weight:400}
.nav{display:flex;gap:6px;align-items:center}
.mstats{display:flex;gap:6px 14px;flex-wrap:wrap;margin:10px 2px 12px;font:500 12.5px var(--font);color:var(--muted)}
.mstats b{color:var(--ink);font-weight:600}
.mstats .bad b{color:var(--danger)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font:600 10.5px var(--font);text-transform:uppercase;letter-spacing:.07em;color:var(--faint);text-align:center;padding-bottom:3px}
.dc{position:relative;aspect-ratio:1/1.12;max-width:100%;border-radius:13px;background:var(--cell-bg);border:1px solid var(--cell-line);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:7px 2px 6px;min-width:0}
.dc.blank{background:transparent;border-color:transparent}
.dc .heat{position:absolute;inset:0;background:linear-gradient(180deg,#9D82FF,#5A3BD6);opacity:calc(var(--p) * var(--heat-max));pointer-events:none}
.dc .n{position:relative;font:600 14.5px/1 var(--font);font-variant-numeric:tabular-nums}
.dc.we .n{color:var(--muted)}
.dc .m{position:relative;font:600 9.5px/1 var(--font);color:var(--ink);opacity:.78}
.dc.today{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 16px rgba(124,92,255,.35)}

/* Day (photo 2) */
.day{flex:1;min-height:0;display:flex;flex-direction:column}
.dpanel{flex:none;border-radius:28px;padding:12px 14px 14px;background:linear-gradient(170deg,#7A5CF5 0%,#5B3DDB 60%,#4A2DC4 100%);box-shadow:0 14px 34px rgba(90,59,214,.45),inset 0 1px 0 rgba(255,255,255,.25);margin-bottom:12px}
.dp-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:2px;height:34px;padding-right:8px;font:600 14px var(--font);color:#fff}
.back svg{width:18px;height:18px}
.dpanel .icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);width:34px;height:34px;color:#fff}
.dpanel .pill-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.18);color:#fff}
.dtitle{text-align:center;font:600 20px/1.2 var(--font);margin-top:6px}
.dsub{text-align:center;margin:3px 0 12px;font:500 12.5px var(--font);color:rgba(255,255,255,.78)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px 0;font:500 12px var(--font);color:rgba(255,255,255,.75)}
.wd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 16px var(--font);color:#fff;font-variant-numeric:tabular-nums}
.wd[aria-current="date"] b{background:#3A1FA8;box-shadow:0 6px 16px rgba(20,8,70,.55),inset 0 0 0 1px rgba(255,255,255,.2)}
.wd i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.wd i::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--p) * 100%);background:#fff}
.dctl{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dctl .chips{flex:1;min-width:0}
.tline{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 0 8px;scrollbar-width:none}
.tline::-webkit-scrollbar{display:none}
.trow{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:start;margin-bottom:14px}
.ttime{position:relative;align-self:stretch;padding-top:2px;font:600 12.5px/1.3 var(--font);font-variant-numeric:tabular-nums}
.ttime span{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.ttime::after{content:"";position:absolute;left:5px;top:40px;bottom:-12px;border-left:1px dashed var(--dash)}
.ecard{display:block;width:100%;text-align:left;position:relative}
.etab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 14px;border-radius:14px 14px 0 0;font:600 12px var(--font);color:#fff;background:#9F86FF}
.ebody{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:0 18px 18px 18px;color:#fff;background:linear-gradient(165deg,#9F86FF 0%,#7457EE 100%);box-shadow:0 10px 24px rgba(90,59,214,.35)}
.ecard.sty .etab{background:#D97DF0}
.ecard.sty .ebody{background:linear-gradient(165deg,#D97DF0 0%,#9B46D6 100%);box-shadow:0 10px 24px rgba(155,70,214,.32)}
.ecard.bar .etab{background:#7FA4FF}
.ecard.bar .ebody{background:linear-gradient(165deg,#7FA4FF 0%,#4E6FE6 100%);box-shadow:0 10px 24px rgba(78,111,230,.32)}
.ecard.noshow{opacity:.5}
.etop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.etop b{font:600 16px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etop .pr{font:600 15px var(--font);white-space:nowrap;font-variant-numeric:tabular-nums}
.emeta{font:500 12.5px var(--font);color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epay{align-self:flex-start;margin-top:6px;height:24px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;font:600 11.5px var(--font);background:rgba(255,255,255,.22);color:#fff}
.epay.due{background:#FF6B86}
.grid-scroll{flex:1;min-height:240px;overflow:auto;border-radius:20px;background:var(--grid-bg);box-shadow:var(--shadow-card);border:1px solid var(--glass-line);overscroll-behavior:contain}
.grid{display:grid}
.corner{position:sticky;top:0;left:0;z-index:4;background:var(--grid-head);border-bottom:1px solid var(--glass-line-2)}
.rh{position:sticky;top:0;z-index:3;background:var(--grid-head);border-bottom:1px solid var(--glass-line-2);border-left:1px solid var(--glass-line);padding:9px 7px 8px;min-width:0}
.rh .n{display:flex;align-items:center;gap:6px;font:600 12.5px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh .p{font:500 10.5px var(--font);color:var(--muted);margin-top:2px;white-space:nowrap}
.times{position:sticky;left:0;z-index:2;background:var(--grid-rail);height:calc(var(--slot) * 48)}
.times span{position:absolute;right:7px;transform:translateY(-50%);font:500 10.5px var(--font);color:var(--muted);font-variant-numeric:tabular-nums}
.times span.first{transform:translateY(3px)}
.times span.last{transform:translateY(-110%)}
.col{position:relative;height:calc(var(--slot) * 48);border-left:1px solid var(--glass-line);cursor:copy;
  background-image:linear-gradient(to bottom,var(--grid-hour) 0,var(--grid-hour) 1px,transparent 1px),linear-gradient(to bottom,var(--grid-q) 0,var(--grid-q) 1px,transparent 1px);
  background-size:100% calc(var(--slot) * 4),100% var(--slot)}
.bk{position:absolute;left:3px;right:3px;border-radius:9px;padding:3px 6px 3px 9px;background-color:var(--cab-a);box-shadow:inset 3px 0 0 var(--cab);color:var(--ink);display:flex;flex-direction:column;gap:1px;overflow:hidden;z-index:1;cursor:pointer;border:1px solid var(--cab-b)}
.bk.sty{background-color:var(--sty-a);box-shadow:inset 3px 0 0 var(--sty);border-color:var(--sty-b)}
.bk.bar{background-color:var(--bar-a);box-shadow:inset 3px 0 0 var(--bar);border-color:var(--bar-b)}
.bk .who{font:600 12px/1.25 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.bk .t{font:500 10.5px/1.3 var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk.short{flex-direction:row;align-items:center;gap:6px;padding-block:0}
.bk.unpaid::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 6px var(--danger)}
.bk.full{background-image:repeating-linear-gradient(135deg,var(--stripe) 0 1px,transparent 1px 10px)}
.bk.noshow{opacity:.5}
.bk.noshow .who{text-decoration:line-through}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--danger);z-index:2;pointer-events:none;box-shadow:0 0 8px var(--danger)}

/* Lists (photo 1 history rows) */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{padding-left:42px}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--row-bg);border:1px solid var(--glass-line);text-align:left;width:100%;box-shadow:var(--shadow-row)}
.lrow:hover{background:var(--row-bg-2)}
.lrow.off{opacity:.5}
.lmain{display:flex;flex-direction:column;min-width:0}
.lmain b{font:600 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain small{font:500 12.5px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lside{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lside b{font:600 14.5px var(--font);white-space:nowrap;font-variant-numeric:tabular-nums}
.lside small{font:500 11.5px var(--font);color:var(--muted);white-space:nowrap}
.lside .bad{color:var(--danger)}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);color:var(--link);flex:none}
.ico svg{width:18px;height:18px}
.ico.k-cab{color:var(--cab)}
.ico.k-sty{color:var(--sty)}
.ico.k-bar{color:var(--bar)}

/* Finance (photo 4) */
.fhead{margin:6px 2px 12px}
.fhead h1{font:300 30px/1.1 var(--font);letter-spacing:-.01em}
.mswitch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.mswitch b{font:600 16px var(--font)}
.mswitch b span{color:var(--muted);font-weight:400}
.herocard{position:relative;overflow:hidden;border-radius:26px;padding:16px 16px 18px;background:var(--grad);box-shadow:0 16px 36px rgba(90,59,214,.45),inset 0 1px 0 rgba(255,255,255,.35);margin-bottom:12px;color:#fff}
.herocard .wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:70%;pointer-events:none}
.herocard .h-top{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 15px var(--font)}
.herocard .h-top small{font:500 12.5px var(--font);color:rgba(255,255,255,.82)}
.herocard .h-val{position:relative;margin-top:22px;font:300 44px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.herocard .h-val small{font:400 18px var(--font);margin-left:6px}
.herocard .h-sub{position:relative;margin-top:8px;font:500 13px var(--font);color:rgba(255,255,255,.88)}
.herocard .h-sub b{font-weight:700}
.herocard.neg{background:linear-gradient(160deg,#FF9AAE 0%,#E0577A 45%,#8C2B67 100%);box-shadow:0 16px 36px rgba(180,50,100,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{padding:12px;border-radius:20px;background:var(--card-grad);border:1px solid var(--glass-line);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.tile .badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--grad-btn);color:#fff;margin-bottom:8px;box-shadow:0 6px 14px rgba(124,92,255,.4)}
.tile .badge svg{width:16px;height:16px}
.tile > span:not(.badge){font:500 12.5px var(--font);color:var(--muted)}
.tile b{font:600 19px/1.2 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tile small{font:500 11.5px var(--font);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.bad b{color:var(--danger)}
.tile.bad .badge{background:linear-gradient(160deg,#FF8FA5,#D9466C)}
.up{color:var(--ok)}
.down{color:var(--danger)}
.chartcard{padding:14px 12px 10px;margin-bottom:12px}
.chartcard .c-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 6px}
.chartcard .c-h b{font:600 15px var(--font)}
.chartcard .c-h small{font:500 12px var(--font);color:var(--muted)}
.area{width:100%;height:auto;display:block;overflow:visible}
.area .gl{stroke:rgba(255,255,255,.06);stroke-width:1}
.area .ln{fill:none;stroke:#B9A4FF;stroke-width:2.2;filter:drop-shadow(0 0 6px rgba(160,130,255,.85))}
.area .ax{fill:var(--muted);font:500 10px var(--font)}
.area .tip{fill:rgba(30,22,60,.92);stroke:rgba(185,164,255,.5)}
.area .tipt{fill:#fff;font:600 10.5px var(--font)}
.area .mk{fill:#fff;filter:drop-shadow(0 0 6px #fff)}
.area .vl{stroke:rgba(255,255,255,.35);stroke-dasharray:3 3}
.perf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px}
.ring{width:112px;height:112px}
.ring .tr{stroke:var(--track)}
.ring .vl{stroke:url(#ringGrad);filter:drop-shadow(0 0 6px rgba(160,130,255,.7))}
.ring .big{fill:var(--ink);font:300 22px var(--font)}
.ring .cap{fill:var(--muted);font:500 9.5px var(--font)}
.perf ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.perf li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 8px;align-items:center;font:500 13.5px var(--font)}
.perf li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.perf li b{font-weight:600;font-variant-numeric:tabular-nums}
.perf li small{grid-column:2 / 4;font:500 11.5px var(--font);color:var(--muted)}
.rank-row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:11px 12px;border-radius:18px;background:var(--row-bg);border:1px solid var(--glass-line);width:100%;text-align:left;box-shadow:var(--shadow-row)}
.rank-row .rk{font:600 13px var(--font);color:var(--muted);text-align:right}
.meter{grid-column:2 / 4;height:5px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6A4BE8,#C9B8FF)}
.meter i.cab{background:var(--cab)}
.meter i.sty{background:var(--sty)}
.meter i.bar{background:var(--bar)}
.meter i.exp{background:linear-gradient(90deg,#D9466C,#FF9AAE)}
.cat-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font:700 12.5px var(--font);color:#fff;background:linear-gradient(160deg,hsl(var(--h) 65% 62%),hsl(calc(var(--h) + 25) 60% 42%));flex:none}
.rec-tag{display:inline-block;margin-left:6px;font:600 10.5px var(--font);color:var(--link);background:var(--glass-2);padding:2px 7px;border-radius:999px;vertical-align:1px}

/* Settings */
.rules{padding:2px 14px;margin-bottom:6px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--glass-line);font-size:14px}
.rule:first-child{border-top:0}
.rule > span,.rule > label{color:var(--muted)}
.rule b{font-weight:600;text-align:right}
.rule select{width:auto;height:38px}
.storage-actions{display:flex;flex-direction:column;gap:8px;padding:4px 0 14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));z-index:51;border-radius:28px 28px 0 0;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--sheet-top) 0%,var(--sheet) 30%,var(--sheet-2) 100%);border:1px solid var(--glass-line);border-bottom:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow-sheet)}
.scrim.anim{animation:fade .2s ease-out}
.sheet.anim{animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(48px);opacity:0}}
.grip{width:38px;height:4px;border-radius:2px;background:var(--glass-line-2);margin:9px auto 2px;flex:none}
.sheet-head{flex:none;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:8px 12px}
.sheet-head h2{font:500 21px/1.2 var(--font)}
.sheet-head p{margin:3px 0 0;font:500 13px var(--font);color:var(--muted)}
.who-head{display:flex;gap:12px;align-items:center;min-width:0}
.sheet-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:16px;padding-block:4px 16px;scrollbar-width:none}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-foot{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:12px 14px;border-top:1px solid var(--glass-line)}
.foot-hint{margin:0;text-align:center;font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font:600 11px var(--font);text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
input[type=text],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;min-width:0;height:48px;padding:0 14px;border-radius:15px;border:1px solid var(--glass-line);background:var(--field-bg);color:var(--ink);font:500 16px var(--font)}
input[type=text],input[type=search],input[type=tel],input[type=number]{-webkit-appearance:none;appearance:none}
/* iOS рисует дату по-своему: по центру и шире ячейки — выравниваем как остальные поля */
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;text-align:left;line-height:46px;min-height:48px}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left;margin:0}
/* Иконка поиска не должна наезжать на текст */
.search input[type=search]{padding-left:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(139,108,255,.25)}
input::placeholder,textarea::placeholder{color:var(--faint)}
select option,select optgroup{background:var(--opt-bg);color:var(--ink)}
textarea{height:auto;min-height:80px;padding:12px 14px;resize:vertical;line-height:1.4}
textarea.code{font:500 12px/1.4 ui-monospace,"SF Mono",Menlo,monospace;min-height:170px}
input.amount{height:64px;font:300 34px var(--font);letter-spacing:-.01em}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tl{position:relative;height:30px;border-radius:10px;background:var(--field-bg);border:1px solid var(--glass-line);overflow:hidden}
.tl i{position:absolute;top:7px;bottom:7px;border-radius:4px;background:var(--tl-busy)}
.tl i.me{background:var(--grad-btn);top:3px;bottom:3px;box-shadow:0 0 10px rgba(139,108,255,.7)}
.tl i.me.bad{background:var(--danger);box-shadow:0 0 10px var(--danger)}
.tl-scale{display:flex;justify-content:space-between;font:500 10.5px var(--font);color:var(--faint);margin-top:-3px}
.gaps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.gap{height:30px;padding:0 11px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-line-2);font:600 12px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.price b{font:300 32px/1.1 var(--font);font-variant-numeric:tabular-nums}
.price small{font:500 12.5px var(--font);color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;font:500 14px var(--font);cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--violet);flex:none}
.note{font:500 13px/1.45 var(--font);color:var(--muted);background:var(--row-bg);border:1px solid var(--glass-line);border-radius:14px;padding:10px 12px}
.note.warn{color:var(--ink);background:rgba(242,179,91,.1);border-color:rgba(242,179,91,.3)}
.alert{font:500 13.5px/1.4 var(--font);color:var(--danger);background:var(--danger-a);border:1px solid rgba(255,107,134,.45);border-radius:14px;padding:10px 12px}
.tchip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:16px;background:var(--row-bg);border:1px solid var(--glass-line)}
.tpick{display:flex;flex-direction:column;gap:6px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--row-bg);border:1px solid var(--glass-line);text-align:left}
.stepper{display:flex;align-items:center;gap:10px;font:500 14px var(--font);flex-wrap:wrap}
.stepper button{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-line-2);font-size:18px;line-height:1;text-align:center}
.stepper b{min-width:24px;text-align:center;font:600 17px var(--font)}
.catgrid{display:flex;flex-wrap:wrap;gap:6px}
.chip.add{border-style:dashed;border-color:var(--glass-line-2);color:var(--link);background:transparent}
.ctiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ctile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:18px;background:var(--card-grad);border:1px solid var(--glass-line);text-align:left;min-width:0;box-shadow:var(--shadow-card)}
.ctile:active{transform:scale(.98)}
.ctile .cat-ico{width:34px;height:34px;border-radius:11px;font-size:11.5px;margin-bottom:6px}
.ctile b{font:600 14px/1.25 var(--font);width:100%;padding-right:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ctile .camt{font:600 15px var(--font);font-variant-numeric:tabular-nums}
.ctile .camt.zero{color:var(--faint);font-weight:500;font-size:13px}
.ctile .cbar{width:100%;height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:5px}
.ctile .cbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#D9466C,#FF9AAE)}
.ctile .cplus{position:absolute;top:11px;right:11px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--glass-2);color:var(--link)}
.ctile .cplus svg{width:14px;height:14px}
.ctile.add{border-style:dashed;border-color:var(--glass-line-2);background:transparent;box-shadow:none;justify-content:center;min-height:118px}
.cat-ico.plus{background:var(--glass-2);color:var(--link)}
.cat-ico.plus svg{width:16px;height:16px}
.catlist{display:flex;flex-direction:column;gap:8px}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) 40px 40px;gap:8px;align-items:center}
.catrow .cat-ico{width:36px;height:36px;border-radius:12px;font-size:11.5px}
.catrow input{height:44px}
.catrow .icon-btn{width:40px;height:40px}
.catrow.hidden{opacity:.6}
.icon-btn[disabled]{opacity:.3;cursor:default}
.catadd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.catadd .btn{width:auto;height:48px;padding:0 16px}
.catgrid .chip{height:34px}
.confirm{display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0 0 2px;font-weight:600;text-align:center}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--row-bg);border:1px solid var(--glass-line);border-radius:16px;padding:10px 12px;min-width:0}
.stat span{display:block;font:500 12px var(--font);color:var(--muted)}
.stat b{font:600 17px var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat.bad b{color:var(--danger)}
.contacts{display:flex;flex-direction:column;gap:8px;font-size:14px}
.contacts div{display:flex;justify-content:space-between;gap:12px}
.contacts span{color:var(--muted)}
.contacts b{font-weight:600;user-select:all;font-variant-numeric:tabular-nums;text-align:right;min-width:0;overflow-wrap:anywhere}

(function(){
'use strict';

/* =========================================================

const OPEN = 600, CLOSE = 1320, STEP = 15, SLOT = 20, DAY_MIN = CLOSE - OPEN; // 10:00–22:00, 48 ячеек по 15 минут

const DOW_DAT = ['воскресеньям','понедельникам','вторникам','средам','четвергам','пятницам','субботам'];
const KINDS = {cab:{many:'Кабинеты', one:'Кабинет'}, sty:{many:'Стилисты', one:'Стилист'}, bar:{many:'Барберы', one:'Барбер'}};

const PAY_CODES = ['unpaid','cash','card','transfer'];
const PAY = {unpaid:'Не оплачено', cash:'Наличные', card:'Карта', transfer:'Перевод'};
// Категории расходов: список только дополняется (в хранилище лежит номер категории)
const EXP_CATS = ['Аренда помещения','Коммунальные','Интернет и связь','Уборка','Расходники','Зарплата','Реклама','Ремонт и мебель','Налоги и банк','Другое'];

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [a,b,c] = s.split('-').map(Number); return new Date(a, b-1, c); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const ymOf = (y, m) => `${y}-${pad(m+1)}`;
const prevYm = ym => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m-2, 1); return ymOf(d.getFullYear(), d.getMonth()); };
const ymFrom = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m-1].toLowerCase()} ${y}`; };
const hm = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const durTxt = m => { const h = Math.floor(m/60), r = m%60; return [h ? h+' ч' : '', r ? r+' мин' : ''].filter(Boolean).join(' ') || '0 мин'; };
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const sRub = n => (n < 0 ? '−' : '') + rub(Math.abs(n));
const kNum = n => (n < 0 ? '−' : '') + Math.round(Math.abs(n)/1000).toLocaleString('ru-RU');
const kRub = n => Math.abs(n) >= 1000 ? (n/1000).toLocaleString('ru-RU', {maximumFractionDigits:1}) + ' тыс' : String(Math.round(n));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().replace(/ё/g,'е');
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; };
const dowDate = s => { const d = parse(s); return `${DOW[d.getDay()]}, ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; };
const shortName = n => { const p = String(n).trim().split(/\s+/); return p.length > 1 ? `${p[p.length-1]} ${p[0][0]}.` : String(n); };
const initials = n => String(n).trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return 230 + (h % 90); }; // оттенки в фиолетово-синей гамме

const mkey = date => 'm' + date.slice(0,4) + date.slice(5,7);  // брони месяца: m202610
const ekey = date => 'e' + date.slice(0,4) + date.slice(5,7);  // разовые расходы месяца: e202610

const SVG = (inner, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
const ICON = {

  search:SVG('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'), close:SVG('<path d="M6 6l12 12M18 6L6 18"/>'),
  copy:SVG('<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'),
  coin:SVG('<circle cx="12" cy="12" r="8"/><path d="M14.5 9.5c-.5-.9-1.4-1.5-2.5-1.5-1.5 0-2.5.9-2.5 2s1 1.7 2.5 2 2.5.9 2.5 2-1 2-2.5 2c-1.1 0-2-.6-2.5-1.5M12 6.5v11"/>'),
  out:SVG('<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>'), check:SVG('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  alert:SVG('<path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="8.5"/>'), clock:SVG('<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'),
  wallet:SVG('<rect x="3.5" y="6" width="17" height="13" rx="3"/><path d="M3.5 10h17M16 14.5h1.5"/>'),
  door:SVG('<path d="M6 20.5V4.5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v16M4 20.5h16M14.5 12v.5"/>'),
  scissors:SVG('<circle cx="6.5" cy="7" r="2.5"/><circle cx="6.5" cy="17" r="2.5"/><path d="M8.5 8.5l11 9M8.5 15.5l11-9"/>'),
  razor:SVG('<path d="M5 19l9-9M12.5 8.5l3-3a2.1 2.1 0 0 1 3 3l-3 3M10 17l2 2"/>'),
  plus:SVG('<path d="M12 5v14M5 12h14"/>', 2.2), up:SVG('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  trash:SVG('<path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>'), undo:SVG('<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>'),
  list:SVG('<path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.5M4.5 12h.5M4.5 17.5h.5"/>'),
  grid:SVG('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9.5 4v16M4 9.5h16M4 15h16"/>')
};
const KIND_ICON = {cab:ICON.door, sty:ICON.scissors, bar:ICON.razor};

const now = new Date();
const TODAY = ymd(now);
const NOW_MIN = now.getHours()*60 + now.getMinutes();
const NOW_YM = TODAY.slice(0,7);

/* =========================================================
   2. Telegram
   ========================================================= */
const TG = window.Telegram && window.Telegram.WebApp;
const tgVer = v => { try { return !!(TG && TG.isVersionAtLeast && TG.isVersionAtLeast(v)); } catch(e){ return false; } };
const IN_TG = !!(TG && TG.initData);
const CLOUD = !!(IN_TG && TG.CloudStorage && tgVer('6.9'));
const SKIN_BG = {light:'#F3F1FA', dusk:'#2A2161', dark:'#0A0716'};
let skinPref = 'dusk';
try { skinPref = localStorage.getItem('cw-skin-v2') || 'dusk'; } catch(e){}
function currentSkin(){
  if (skinPref !== 'auto') return skinPref;
  if (IN_TG && TG.colorScheme) return TG.colorScheme === 'dark' ? 'dark' : 'light';
  try { return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch(e){ return 'light'; }
}
function applySkin(){
  const skin = currentSkin();
  document.documentElement.dataset.skin = skin;
  try { if (tgVer('6.1')){ TG.setHeaderColor(SKIN_BG[skin]); TG.setBackgroundColor(SKIN_BG[skin]); } } catch(e){}
  try { if (tgVer('7.10')) TG.setBottomBarColor(SKIN_BG[skin]); } catch(e){}
}
applySkin();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (skinPref === 'auto') applySkin(); }); } catch(e){}
const haptic = type => { try { if (tgVer('6.1')) TG.HapticFeedback.notificationOccurred(type); } catch(e){} };
function initTelegram(){
  if (!IN_TG) return;
  try { TG.ready(); TG.expand(); } catch(e){}
  try { if (tgVer('7.7')) TG.disableVerticalSwipes(); } catch(e){}   // чтобы прокрутка не закрывала приложение
  applySkin();
  try { TG.onEvent('themeChanged', () => { if (skinPref === 'auto') applySkin(); }); } catch(e){}
  try { if (tgVer('6.1')) TG.BackButton.onClick(goBack); } catch(e){}
}
function syncBack(){
  if (!IN_TG || !tgVer('6.1')) return;
  try { (sheet || (state.tab === 'schedule' && state.mode === 'day')) ? TG.BackButton.show() : TG.BackButton.hide(); } catch(e){}
}
function goBack(){
  if (sheet) closeSheet();
  else if (state.tab === 'schedule' && state.mode === 'day'){ state.mode = 'month'; syncMonth(); render(); }
}

/* =========================================================
   3. Хранилище: Telegram CloudStorage (или память в демо)
   Лимиты Telegram: 1024 ключа, ключ до 128 символов [A-Za-z0-9_-], значение до 4096 символов.
   Данные лежат «блобами»: заголовок `имя` = "версия,кол-во частей", части `имя_версия_i` по ≤3900 символов.
   Запись: новые части → заголовок (атомарное переключение) → удаление старых частей.
   Блобы: cfg (места и правила), ten (арендаторы), mГГГГММ (брони месяца), eГГГГММ (разовые расходы), rex (ежемесячные расходы).
   ========================================================= */
function cloudKV(){
  const cs = TG.CloudStorage;
  const call = fn => new Promise((resolve, reject) => fn((err, val) => err ? reject(new Error(String(err))) : resolve(val)));
  return {
    mode:'cloud',
    keys: async () => (await call(cb => cs.getKeys(cb))) || [],
    get: async keys => { const out = {}; for (let i = 0; i < keys.length; i += 50){ const part = keys.slice(i, i+50); Object.assign(out, (await call(cb => cs.getItems(part, cb))) || {}); } return out; },
    set: (k, v) => call(cb => cs.setItem(k, v, cb)),
    del: async keys => { for (let i = 0; i < keys.length; i += 50){ const part = keys.slice(i, i+50); if (part.length) await call(cb => cs.removeItems(part, cb)); } }
  };
}
function memoryKV(){
  const m = new Map();
  return {
    mode:'demo',
    keys: async () => [...m.keys()],
    get: async keys => { const o = {}; keys.forEach(k => { o[k] = m.has(k) ? m.get(k) : ''; }); return o; },
    set: async (k, v) => {
      if (!/^[A-Za-z0-9_-]{1,128}$/.test(k)) throw new Error('Недопустимый ключ ' + k);
      if (v.length > 4096) throw new Error('Значение длиннее 4096 символов');
      if (!m.has(k) && m.size >= 1024) throw new Error('Хранилище заполнено (1024 ключа)');
      m.set(k, v); return true;
    },
    del: async keys => { keys.forEach(k => m.delete(k)); }
  };
}
const kv = CLOUD ? cloudKV() : memoryKV();
const CHUNK = 3900;
const HEADER_RE = /^[a-z]+\d*$/;
const parseHeader = v => { if (!v) return null; const [ver, n] = String(v).split(','); const c = parseInt(n, 10); return ver && c >= 0 ? {ver, n:c} : null; };
const chunkKey = (name, ver, i) => `${name}_${ver}_${i}`;
function splitChunks(str){
  const parts = []; let i = 0;
  while (i < str.length){
    let j = Math.min(i + CHUNK, str.length);
    const c = str.charCodeAt(j - 1);
    if (j < str.length && c >= 0xD800 && c <= 0xDBFF) j--;       // не режем эмодзи пополам
    parts.push(str.slice(i, j)); i = j;
  }
  return parts;
}
function joinFrom(name, values){
  const h = parseHeader(values[name]);
  if (!h) return null;
  let s = '';
  for (let i = 0; i < h.n; i++){
    const v = values[chunkKey(name, h.ver, i)];
    if (v == null || v === '') throw new Error(`Не хватает части ${i+1} из ${h.n} в «${name}»`);
    s += v;
  }
  return s;
}
async function readBlob(name){
  const head = await kv.get([name]);
  const h = parseHeader(head[name]);
  if (!h) return null;
  const keys = Array.from({length:h.n}, (_, i) => chunkKey(name, h.ver, i));
  const vals = keys.length ? await kv.get(keys) : {};
  vals[name] = head[name];
  return joinFrom(name, vals);
}
async function writeBlob(name, str){
  const old = parseHeader((await kv.get([name]))[name]);
  let ver; do { ver = Math.random().toString(36).slice(2,6); } while (old && old.ver === ver);
  const parts = splitChunks(str);
  await Promise.all(parts.map((p, i) => kv.set(chunkKey(name, ver, i), p)));
  await kv.set(name, `${ver},${parts.length}`);
  if (old && old.n) await kv.del(Array.from({length:old.n}, (_, i) => chunkKey(name, old.ver, i)));
}
async function deleteBlob(name){
  const h = parseHeader((await kv.get([name]))[name]);
  const keys = [name];
  if (h) for (let i = 0; i < h.n; i++) keys.push(chunkKey(name, h.ver, i));
  await kv.del(keys);
}

/* Компактное кодирование: одна бронь ≈ 55 символов */
const encCfg = () => JSON.stringify({v:1, minDur:cfg.minDur, res:cfg.resources.map(r => [r.id, r.kind, r.name, r.note, r.hour, r.day, r.active ? 1 : 0]), cats:cfg.cats.map(c => [c.id, c.name, c.hidden ? 1 : 0])});
const decCfg = str => { const o = JSON.parse(str); return {minDur:o.minDur || 60, resources:o.res.map(r => ({id:r[0], kind:r[1], name:r[2], note:r[3] || '', hour:r[4], day:r[5], active:!!r[6]})), cats:o.cats ? o.cats.map(c => ({id:c[0], name:c[1], hidden:!!c[2]})) : defaultCats()}; };
const encTen = list => JSON.stringify(list.map(t => [t.id, t.name, t.activity || '', t.phone || '', t.tg || '', t.note || '']));
const decTen = str => str ? JSON.parse(str).map(r => ({id:r[0], name:r[1], activity:r[2], phone:r[3], tg:r[4], note:r[5]})) : [];
const encMonth = list => JSON.stringify(list.map(b => [b.id, b.resourceId, b.tenantId, +b.date.slice(8), b.kind === 'full_day' ? 1 : 0, (b.start - OPEN) / STEP, (b.end - OPEN) / STEP, b.price, b.priceManual ? 1 : 0, Math.max(0, STATUS_CODES.indexOf(b.status)), Math.max(0, PAY_CODES.indexOf(b.payment)), b.seriesId || 0, b.comment || 0]));
const decMonth = (name, str) => {
  if (!str) return [];
  const y = name.slice(1,5), m = name.slice(5,7);
  return JSON.parse(str).map(r => ({id:r[0], resourceId:r[1], tenantId:r[2], date:`${y}-${m}-${pad(r[3])}`, kind:r[4] ? 'full_day' : 'hourly', start:OPEN + r[5]*STEP, end:OPEN + r[6]*STEP, price:r[7], priceManual:!!r[8], status:STATUS_CODES[r[9]] || 'active', payment:PAY_CODES[r[10]] || 'unpaid', seriesId:r[11] || null, comment:r[12] || ''}));
};
const encExp = list => JSON.stringify(list.map(e => [e.id, +e.date.slice(8), e.cat, e.amount, e.note || 0]));
const decExp = (name, str) => {
  if (!str) return [];
  const y = name.slice(1,5), m = name.slice(5,7);
  return JSON.parse(str).map(r => ({id:r[0], date:`${y}-${m}-${pad(r[1])}`, cat:r[2], amount:r[3], note:r[4] || ''}));

async function loadAll(){
  const keys = await kv.keys();
  const vals = keys.length ? await kv.get(keys) : {};
  const heads = keys.filter(k => HEADER_RE.test(k));
  const live = new Set(heads);
  heads.forEach(h => { const p = parseHeader(vals[h]); if (p) for (let i = 0; i < p.n; i++) live.add(chunkKey(h, p.ver, i)); });
  const cfgStr = joinFrom('cfg', vals);
  cfg = cfgStr ? decCfg(cfgStr) : defaultCfg();
  tenants = decTen(joinFrom('ten', vals));
  recurring = decRec(joinFrom('rex', vals));
  const bl = [], el = [];
  heads.forEach(h => {
    if (/^m\d{6}$/.test(h)) bl.push(...decMonth(h, joinFrom(h, vals)));
    else if (/^e\d{6}$/.test(h)) el.push(...decExp(h, joinFrom(h, vals)));
  });
  bookings = bl; expenses = el;
  const orphans = keys.filter(k => !live.has(k));
  if (orphans.length) kv.del(orphans).catch(() => {});     // остатки недописанных сохранений
  usage.keys = keys.length - orphans.length;
  if (!cfgStr && !cfgSeeded){ cfgSeeded = true; persist(() => writeBlob('cfg', encCfg())); }  // первый запуск
}

/* Очередь сохранений: интерфейс меняется сразу, запись идёт по очереди в фоне */
let queue = Promise.resolve();
function persist(task){
  pending++; updateSync();
  try { if (IN_TG && tgVer('6.2')) TG.enableClosingConfirmation(); } catch(e){}
  queue = queue.then(task).then(() => { lastError = ''; }).catch(async err => {
    lastError = err.message || String(err);
    haptic('error');
    toast('Не сохранилось: ' + lastError + '. Перечитываю данные из облака.');
    try { await loadAll(); } catch(e){}
    render(); if (sheet) renderSheet();
  }).finally(() => {
    pending--; updateSync(); refreshUsage();
    try { if (IN_TG && tgVer('6.2') && !pending) TG.disableClosingConfirmation(); } catch(e){}
  });
  return queue;
}
/* Перед записью блоб перечитывается из облака и правки накладываются на свежую версию —
   так изменения с другого устройства не затираются. */
function persistBookings(changed, movedFrom){
  const months = new Set(changed.map(b => mkey(b.date)));
  (movedFrom || []).forEach(m => months.add(m));
  const ids = new Set(changed.map(b => b.id));
  return persist(async () => {
    for (const mk of months){
      const fresh = decMonth(mk, await readBlob(mk));
      const next = fresh.filter(b => !ids.has(b.id)).concat(changed.filter(b => mkey(b.date) === mk));
      await writeBlob(mk, encMonth(next));
      bookings = bookings.filter(b => mkey(b.date) !== mk).concat(next);
    }
    render();
  });
}
function persistExpense(e, removed, movedFrom){
  const months = new Set([ekey(e.date)]);
  if (movedFrom) months.add(movedFrom);
  return persist(async () => {
    for (const mk of months){
      const fresh = decExp(mk, await readBlob(mk));
      const next = fresh.filter(x => x.id !== e.id);
      if (!removed && ekey(e.date) === mk) next.push(e);
      if (next.length) await writeBlob(mk, encExp(next)); else await deleteBlob(mk);
      expenses = expenses.filter(x => ekey(x.date) !== mk).concat(next);
    }
    render();
  });
}
function persistRecurring(changed, deletedIds){
  const ids = new Set(changed.map(r => r.id).concat(deletedIds || []));
  return persist(async () => {
    const fresh = decRec(await readBlob('rex'));
    const next = fresh.filter(r => !ids.has(r.id)).concat(changed);
    await writeBlob('rex', encRec(next));
    recurring = next;
    render();
  });
}
function persistTenant(t){
  return persist(async () => {
    const fresh = decTen(await readBlob('ten'));
    const i = fresh.findIndex(x => x.id === t.id);
    if (i >= 0) fresh[i] = t; else fresh.push(t);
    await writeBlob('ten', encTen(fresh));
    tenants = fresh;
  });
}

function statsFor(dates, resList){
  const ids = new Set(resList.map(r => r.id)), ds = new Set(dates);
  let mins = 0, cnt = 0, charged = 0, debt = 0, debtCnt = 0;
  for (const b of bookings){
    if (b.status === 'cancelled' || !ids.has(b.resourceId) || !ds.has(b.date)) continue;
    mins += b.end - b.start; cnt++;
    if (isCharged(b)){ charged += b.price; if (b.payment === 'unpaid' && b.date <= TODAY){ debt += b.price; debtCnt++; } }
  }
  const cap = resList.length * DAY_MIN * dates.length;
  return {occ:cap ? mins/cap : 0, mins, cnt, charged, debt, debtCnt};
}
function hourlyOcc(date, resList){
  const ids = new Set(resList.map(r => r.id)), out = Array(12).fill(0);
  for (const b of bookings){
    if (b.date !== date || b.status === 'cancelled' || !ids.has(b.resourceId)) continue;
    for (let h = 0; h < 12; h++){ const s = OPEN + h*60, e = s + 60; out[h] += Math.max(0, Math.min(e, b.end) - Math.max(s, b.start)); }
  }
  return out.map(v => resList.length ? v / (resList.length * 60) : 0);
}
function freeGaps(list){
  const out = []; let cur = OPEN;
  for (const b of list){ if (b.start > cur) out.push([cur, b.start]); cur = Math.max(cur, b.end); }
  if (cur < CLOSE) out.push([cur, CLOSE]);
  return out;
}

function expensesFor(y, m){
  const ym = ymOf(y, m), days = new Date(y, m+1, 0).getDate();
  const one = expenses.filter(e => e.date.startsWith(ym)).map(e => Object.assign({rec:false}, e));
  const rec = recurring.filter(r => r.from <= ym && (!r.to || r.to >= ym)).map(r => ({id:r.id, rec:true, date:`${ym}-${pad(Math.min(r.day, days))}`, cat:r.cat, amount:r.amount, note:r.note, from:r.from}));
  const byCat = {}; let total = 0, recTotal = 0;
  rec.concat(one).forEach(e => { total += e.amount; byCat[e.cat] = (byCat[e.cat] || 0) + e.amount; if (e.rec) recTotal += e.amount; });
  return {rec, one, total, recTotal, byCat};
}
function analytics(y, m){
  const prefix = ymOf(y, m), days = new Date(y, m+1, 0).getDate();
  const act = cfg.resources.filter(r => r.active);
  const a = {revenue:0, paid:0, debt:0, expected:0, mins:0, count:0, byDay:Array(days).fill(0), kinds:{}, res:{}, ten:{}, days};
  KIND_ORDER.forEach(k => { a.kinds[k] = {rev:0, mins:0, n:act.filter(r => r.kind === k).length}; });
  cfg.resources.forEach(r => { a.res[r.id] = {rev:0, mins:0}; });
  for (const b of bookings){
    if (!b.date.startsWith(prefix) || b.status === 'cancelled') continue;
    const r = res(b.resourceId), len = b.end - b.start;
    const t = a.ten[b.tenantId] || (a.ten[b.tenantId] = {rev:0, paid:0, debt:0, mins:0, count:0});
    a.mins += len; a.count++; t.mins += len; t.count++;
    if (a.kinds[r.kind]) a.kinds[r.kind].mins += len;
    if (a.res[r.id]) a.res[r.id].mins += len;
    if (!isCharged(b)) continue;
    a.revenue += b.price; t.rev += b.price; a.byDay[+b.date.slice(8) - 1] += b.price;
    if (a.kinds[r.kind]) a.kinds[r.kind].rev += b.price;
    if (a.res[r.id]) a.res[r.id].rev += b.price;
    if (b.payment !== 'unpaid'){ a.paid += b.price; t.paid += b.price; }
    else if (b.date <= TODAY){ a.debt += b.price; t.debt += b.price; }
    else a.expected += b.price;
  }
  a.occ = act.length ? a.mins / (act.length * DAY_MIN * days) : 0;
  a.exp = expensesFor(y, m);
  a.profit = a.revenue - a.exp.total;
  a.cashProfit = a.paid - a.exp.total;
  a.margin = a.revenue ? a.profit / a.revenue : 0;
  return a;
}

function smoothPath(p, yMin, yMax){
  if (!p.length) return '';
  if (p.length === 1) return `M${p[0][0]},${p[0][1]}`;
  const cl = v => Math.min(yMax, Math.max(yMin, v)).toFixed(1);
  let d = `M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++){
    const p0 = p[i-1] || p[i], p1 = p[i], p2 = p[i+1], p3 = p[i+2] || p2;
    d += ` C${(p1[0] + (p2[0]-p0[0])/6).toFixed(1)},${cl(p1[1] + (p2[1]-p0[1])/6)} ${(p2[0] - (p3[0]-p1[0])/6).toFixed(1)},${cl(p2[1] - (p3[1]-p1[1])/6)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function sparkSVG(values, markIdx){
  const W = 160, H = 84, top = 8, base = 76;
  const sm = values.map((v, i) => (values[i-1] ?? v)*.25 + v*.5 + (values[i+1] ?? v)*.25);   // сглаживание по 3 дням
  const max = Math.max(...sm, 1), n = sm.length;
  const pts = sm.map((v, i) => [n === 1 ? W/2 : i * W / (n-1), base - v / max * (base - top)]);
  const line = smoothPath(pts, top, base);
  const mk = markIdx >= 0 && markIdx < n ? pts[markIdx] : null;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9D82FF" stop-opacity=".45"/><stop offset="1" stop-color="#9D82FF" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W},${H} L0,${H} Z" fill="url(#spg)"/><path class="ln" d="${line}" vector-effect="non-scaling-stroke"/>${mk ? `<circle class="mk" cx="${mk[0].toFixed(1)}" cy="${mk[1].toFixed(1)}" r="3.5"/>` : ''}</svg>`;
}
function areaChart(values, todayIdx){
  const W = 330, H = 168, L = 6, R = 6, T = 34, B = 24, n = values.length, max = Math.max(...values, 1);
  const x = i => L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)), y = v => T + (1 - v / max) * (H - T - B);
  const line = smoothPath(values.map((v, i) => [x(i), y(v)]), T, H - B);
  let mi = 0; values.forEach((v, i) => { if (v > values[mi]) mi = i; });
  const mx = x(mi), my = y(values[mi]), label = `${kRub(values[mi])} ₽ · ${mi+1}-е`;
  const tw = label.length * 6 + 14, tx = Math.min(W - R - tw, Math.max(L, mx - tw/2)), ty = Math.max(2, my - 30);
  const grid = [0, .5, 1].map(f => `<line class="gl" x1="${L}" x2="${W-R}" y1="${(T + f*(H-T-B)).toFixed(1)}" y2="${(T + f*(H-T-B)).toFixed(1)}"/>`).join('');
  const ticks = [1, 10, 20, n].filter((d, i, arr) => arr.indexOf(d) === i).map(d => `<text class="ax" x="${x(d-1).toFixed(1)}" y="${H-6}" text-anchor="${d === 1 ? 'start' : d === n ? 'end' : 'middle'}">${d}</text>`).join('');
  const today = todayIdx >= 0 && todayIdx < n && todayIdx !== mi ? `<line class="vl" x1="${x(todayIdx).toFixed(1)}" x2="${x(todayIdx).toFixed(1)}" y1="${T}" y2="${H-B}"/>` : '';

    ${grid}${today}<path d="${line} L${x(n-1).toFixed(1)},${H-B} L${x(0).toFixed(1)},${H-B} Z" fill="url(#arg)"/><path class="ln" d="${line}"/>

function ringSVG(frac, big, cap){
  const r = 46, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 112 112" role="img" aria-label="${cap}: ${big}"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9B8FF"/><stop offset="1" stop-color="#6A4BE8"/></linearGradient></defs>
    <circle class="tr" cx="56" cy="56" r="${r}" fill="none" stroke-width="9"/><circle class="vl" cx="56" cy="56" r="${r}" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 56 56)"/>
    <text class="big" x="56" y="58" text-anchor="middle">${big}</text><text class="cap" x="56" y="74" text-anchor="middle">${cap}</text></svg>`;
}
const waveSVG = () => `<svg class="wave" viewBox="0 0 320 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 70 C60 40 110 95 170 66 S270 30 320 58 V120 H0Z" fill="rgba(255,255,255,.14)"/><path d="M0 92 C70 70 120 110 190 88 S280 70 320 84 V120 H0Z" fill="rgba(255,255,255,.12)"/></svg>`;

const filterChips = () => `<div class="chips" role="group" aria-label="Какие места показывать">${

const avatar = (t, size) => `<span class="av${size ? ' ' + size : ''}" style="--h:${hue(t.name)}" aria-hidden="true">${esc(initials(t.name))}</span>`;

function homeHTML(){
  const act = cfg.resources.filter(r => r.active);
  const t = statsFor([TODAY], act);
  const h = now.getHours();
  const greet = h < 5 ? 'Доброй ночи' : h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : h < 23 ? 'Добрый вечер' : 'Доброй ночи';
  const hero = t.cnt ? `Сегодня <b>${t.cnt}</b> ${plural(t.cnt,'бронь','брони','броней')}<br>на ${rub(t.charged)}` : 'Сегодня<br>записей пока нет';
  const nowHour = Math.floor((NOW_MIN - OPEN) / 60);
  const bars = hourlyOcc(TODAY, act).map((v, i) => `<i class="${i < nowHour ? 'past' : ''}" style="height:${Math.max(5, v*100).toFixed(0)}%"></i>`).join('');
  const am = analytics(now.getFullYear(), now.getMonth());

  const {y, m} = state, first = new Date(y, m, 1), days = new Date(y, m+1, 0).getDate();

  for (const b of bookings){

  }

    const p = per[ds] || {mins:0, cnt:0}, occ = vis.length ? p.mins / (vis.length * DAY_MIN) : 0, dow = new Date(y, m, i+1).getDay(), pct = Math.round(occ*100);
    cells += `<button class="dc${ds === TODAY ? ' today' : ''}${dow === 0 || dow === 6 ? ' we' : ''}" data-action="open-day" data-date="${ds}" style="--p:${occ.toFixed(3)}" aria-label="${i+1} ${MONTHS_GEN[m]}: ${p.cnt} ${plural(p.cnt,'бронь','брони','броней')}, загрузка ${pct}%"><span class="heat"></span><span class="n">${i+1}</span><span class="m">${p.cnt ? pct + '%' : ''}</span></button>`;
  });
  const isNow = y === now.getFullYear() && m === now.getMonth();
  return `<section>
    <p class="greet">${greet}!</p>
    <h1 class="hero">${hero}</h1>
    <div class="acts">
      <button class="act" data-action="open-day" data-date="${TODAY}"><span class="act-h">Сегодня${ICON.right}</span><small>загрузка по часам</small><span class="hbars" aria-hidden="true">${bars}</span><span class="act-v"><b>${Math.round(t.occ*100)}</b><small>% мест</small></span></button>
      <button class="act" data-action="go-finance"><span class="act-h">${MONTHS[now.getMonth()]}${ICON.right}</span><small>прибыль месяца</small>${sparkSVG(am.byDay, now.getDate()-1)}<span class="act-v"><b>${kNum(am.profit)}</b><small>тыс ₽</small></span></button>
    </div>
    <div class="glass calcard">
      <div class="mhead"><h2 class="mtitle">${MONTHS[m]} <span>${y}</span></h2>
        <div class="nav">${isNow ? '' : '<button class="pill-btn" data-action="go-today">Сегодня</button>'}
          <button class="icon-btn" data-action="month-prev" aria-label="Предыдущий месяц">${ICON.left}</button>
          <button class="icon-btn" data-action="month-next" aria-label="Следующий месяц">${ICON.right}</button></div></div>

      <div class="mstats"><span>загрузка <b>${Math.round(st.occ*100)}%</b></span><span>выручка <b>${rub(st.charged)}</b></span>${st.debt ? `<span class="bad">долг <b>${rub(st.debt)}</b></span>` : ''}</div>
      <div class="cal">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<span class="dow">${d}</span>`).join('')}${cells}</div>
    </div>

}

function blockHTML(b){
  const r = res(b.resourceId), t = ten(b.tenantId);
  const top = (b.start - OPEN) / STEP * SLOT, h = (b.end - b.start) / STEP * SLOT - 2;
  const time = b.kind === 'full_day' ? 'Весь день' : `${hm(b.start)}–${hm(b.end)}`;
  const cls = ['bk', r.kind, b.kind === 'full_day' ? 'full' : '', b.payment === 'unpaid' && b.status === 'active' ? 'unpaid' : '', b.status === 'no_show' ? 'noshow' : '', h < 36 ? 'short' : ''].filter(Boolean).join(' ');
  return `<button class="${cls}" style="top:${top+1}px;height:${h}px" data-action="edit-booking" data-id="${b.id}" aria-label="${esc(t.name)}, ${time}, ${esc(r.name)}"><span class="who">${esc(shortName(t.name))}</span><span class="t">${time}${b.seriesId ? ' ↻' : ''}</span>${h >= 72 ? `<span class="t">${rub(b.price)}</span>` : ''}</button>`;
}
function entryHTML(b){
  const r = res(b.resourceId), t = ten(b.tenantId);
  const unpaid = b.payment === 'unpaid' && b.status === 'active', due = unpaid && b.date <= TODAY;
  const pay = b.status === 'no_show' ? 'Не пришёл' : unpaid ? (due ? 'Не оплачено' : 'Оплата при визите') : PAY[b.payment];
  const time = b.kind === 'full_day' ? '<b>Весь</b><span>день</span>' : `<b>${hm(b.start)}</b><span>${hm(b.end)}</span>`;
  const meta = [b.kind === 'full_day' ? '10:00–22:00' : durTxt(b.end - b.start), t.activity, b.seriesId ? '↻ серия' : ''].filter(Boolean).map(esc).join(' · ');
  return `<div class="trow"><div class="ttime">${time}</div>
    <button class="ecard ${r.kind}${b.status === 'no_show' ? ' noshow' : ''}" data-action="edit-booking" data-id="${b.id}">
      <span class="etab">${esc(r.name)}</span>
